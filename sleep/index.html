<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="별잠">
<title>별잠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f24;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.11);--ink:#e8ebff;--ink2:#97a0c6;--moon:#ffd98a;--accent:#8fb4ff;--good:#7fe0b0;--warn:#ffbd85;--bad:#ff8f8f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#0a0f24}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#060a1c 0%,#0f1636 60%,#1b1f4a 100%)}
body{background:transparent;color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;font-size:15px;line-height:1.55;min-height:100vh;-webkit-tap-highlight-color:transparent}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
#stars i{position:absolute;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#stars i{animation:none}}
button{font:inherit;color:inherit;cursor:pointer}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:6px 0}
.moon{width:30px;height:30px;border-radius:50%;box-shadow:inset -9px -3px 0 0 var(--moon);transform:rotate(-20deg)}
.logo{font-size:24px;font-weight:700;letter-spacing:-.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
h2{font-size:26px;margin:8px 0 2px;font-weight:700}
h3{font-size:17px;margin:0 0 10px}
.muted{color:var(--ink2)} .small{font-size:13px} .hint{font-size:13px;color:var(--ink2);margin:0 0 8px}
.seg{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-top:6px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 4px;color:var(--ink2);font-size:14px}
.seg button.on{background:var(--accent);color:#0a0f24;font-weight:700}
.row{display:flex;gap:8px;align-items:center}
.sb{justify-content:space-between}
.icon{border:0;background:none;width:40px;height:40px;border-radius:50%;font-size:22px;color:var(--ink2)}
.in{font:inherit;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
input[type=time],input[type=date]{color-scheme:dark;-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;text-align:center;min-height:40px}
input[type=time]::-webkit-date-and-time-value,input[type=date]::-webkit-date-and-time-value{text-align:center}
.tr{display:grid;grid-template-columns:1fr 132px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.tr:last-of-type{border:0}
.tr .lab{font-size:15px}
.tr .lab small{display:block;font-size:12px;color:var(--ink2);line-height:1.4}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.sw input{width:20px;height:20px;accent-color:var(--moon);flex:none}
.grp{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:4px 12px 8px;margin-top:10px}
.grp h4{margin:8px 0 2px;font-size:15px}
.chk{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chk label{margin:0;display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;color:var(--ink)}
.chk input{accent-color:var(--moon)}
.ex{font-size:13px;color:var(--ink2);background:rgba(143,180,255,.07);border-radius:10px;padding:8px 10px;margin:6px 0 4px}
.big{font-size:44px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}
.bigin{font:inherit;font-size:44px;font-weight:700;background:none;border:0;border-bottom:2px dashed var(--line);color:var(--ink);width:auto;padding:0;color-scheme:dark;letter-spacing:-1px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.opt .t{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.opt small{display:block;color:var(--ink2);font-size:12px}
.opt.sel{border-color:var(--accent);background:rgba(143,180,255,.12)}
.opt.no{opacity:.45}
.opt.rec{border-color:var(--moon)}
.tag{font-size:11px;border-radius:999px;padding:2px 8px;white-space:nowrap;border:1px solid currentColor}
.tag.rec{color:var(--moon)} .tag.ok{color:var(--good)} .tag.short{color:var(--warn)} .tag.no{color:var(--bad)} .tag.long{color:var(--accent)}
.wave{width:100%;height:auto;display:block;margin-top:6px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:12px;padding:11px 16px;font-size:15px}
.btn.pri{background:var(--moon);color:#1a1530;border-color:var(--moon);font-weight:700}
.btn.full{width:100%;margin-top:10px}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.danger{color:var(--bad);border-color:rgba(255,143,143,.4)}
.lnk{border:0;background:none;color:var(--accent);font-size:13px;text-decoration:underline;padding:2px 4px}
.note{font-size:13px;color:var(--ink2);border-left:3px solid var(--accent);padding:4px 0 4px 10px;margin:10px 0 0}
.warnbox{background:rgba(255,189,133,.1);border:1px solid rgba(255,189,133,.35);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.feel{display:flex;gap:8px}
.feel button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:14px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--ink2)}
.feel button b{font-size:26px;font-weight:400}
.feel button.on{border-color:var(--moon);background:rgba(255,217,138,.12);color:var(--ink)}
label{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats small{font-size:12px;color:var(--ink2)}
.chart{width:100%;height:auto;display:block}
.log{display:grid;grid-template-columns:62px 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.log:last-child{border:0}
.log .d{color:var(--ink2);font-size:13px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wk div{text-align:center}
.wk span{display:block;font-size:12px;color:var(--ink2);margin-bottom:3px}
.wk input{font:inherit;font-size:12px;width:100%;padding:6px 0;text-align:center;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:8px;color:var(--ink);color-scheme:dark}
.sp{display:grid;grid-template-columns:1fr 92px auto;gap:6px;align-items:center;margin-bottom:6px}
.sp .lab{font-size:14px}
.sp .lab small{display:block;color:var(--ink2);font-size:12px}
.rng{width:100%;accent-color:var(--moon)}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(8,12,30,.92);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.nav .in2{max-width:520px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;padding:12px 0 14px;color:var(--ink2);font-size:15px}
.nav button.on{color:var(--moon);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#0a0f24;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="stars"></div>
<div class="app">
  <header><div class="moon"></div><div class="logo">별잠</div></header>
  <main id="main"></main>
</div>
<nav class="nav"><div class="in2"><button data-v="calc">계산</button><button data-v="log">기록</button><button data-v="set">설정</button></div></nav>
<div id="toast"></div>
<script>
/* ---------- 별 ---------- */
(()=>{const s=document.getElementById('stars');let h='';for(let i=0;i<70;i++){const z=Math.random()<.15?2:1;h+=`<i style="left:${Math.random()*100}%;top:${Math.random()*70}%;width:${z}px;height:${z}px;opacity:${.3+Math.random()*.6};animation-delay:${Math.random()*4}s"></i>`}s.innerHTML=h})();

/* ---------- 유틸 ---------- */
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateOf=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const DOW=['일','월','화','수','목','금','토'];
const md=k=>{const d=dateOf(k);return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`};
const toMin=s=>{if(!s)return null;const[h,m]=s.split(':').map(Number);return h*60+m};
const norm=m=>((Math.round(m)%1440)+1440)%1440;
const hm=m=>{m=norm(m);return pad(Math.floor(m/60))+':'+pad(m%60)};
const dur=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?`${h}시간 ${r}분`:`${h}시간`):`${r}분`};
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

/* ---------- 저장 ---------- */
const KEY='byeoljam-v1';
function fresh(){return {v:1,cycle:90,auto:true,latency:15,goal:480,wake:{0:'09:00',1:'06:30',2:'06:30',3:'06:30',4:'06:30',5:'06:30',6:'09:00'},special:[],wakeEach:false,dorm:{wk:{on:false,earliest:'22:30',latest:'23:30'},we:{on:false,earliest:'23:00',latest:'00:30'},weNights:[5,6]},logs:[],plan:null}}
const NIGHT=['일','월','화','수','목','금','토'];
function dormFor(nightDow){const d=state.dorm,g=d.weNights.includes(nightDow)?d.we:d.wk;return g.on?{...g,we:d.weNights.includes(nightDow)}:null}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.wake)return Object.assign(fresh(),s)}catch(e){}return fresh()}
let state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('이 브라우저에서는 저장이 안 돼요')}}

/* ---------- 계산 ---------- */
const targetKey=()=>keyOf(new Date().getHours()<5?today():addDays(today(),1));
function wakeFor(k){const s=state.special.find(x=>x.date===k);return s?{t:s.wake,label:s.label||'특별한 날'}:{t:state.wake[dateOf(k).getDay()],label:''}}
const inBed=l=>norm(toMin(l.wake)-toMin(l.bed));
const sleepMin=l=>Math.max(0,inBed(l)-state.latency);
function estimate(){
  const L=state.logs.slice(-40).filter(l=>l.feel).map(l=>({S:sleepMin(l),f:l.feel}));
  const g=L.filter(x=>x.f===3),b=L.filter(x=>x.f===1);
  if(L.length<6||g.length<2||b.length<1)return {ok:false,n:L.length,g:g.length,b:b.length};
  const d=(S,c)=>{const r=S%c;return Math.min(r,c-r)};
  let best=null,base=null;
  for(let c=75;c<=115;c+=5){const o=mean(g.map(x=>d(x.S,c)))-mean(b.map(x=>d(x.S,c)))+.15*Math.abs(c-90);if(c===90)base=o;if(!best||o<best.o)best={c,o}}
  if(base-best.o<4)best.c=90;
  return {ok:true,c:best.c,n:L.length};
}
const cycleNow=()=>{const e=estimate();return state.auto&&e.ok?e.c:state.cycle};
function bedOpts(wakeM,nightDow){
  const c=cycleNow(),lat=state.latency,dm=nightDow==null?null:dormFor(nightDow),E=dm?toMin(dm.earliest):null,Lt=dm?toMin(dm.latest):null,rel=t=>norm(wakeM-t);
  const ops=[7,6,5,4].map(n=>{const sl=n*c,before=lat+sl,o={n,sl,lie:norm(wakeM-before),before,why:''};
    if(E!==null&&before>rel(E))o.why=`점호 끝(${dm.earliest}) 전이라 못 누워요`;
    else if(Lt!==null&&before<rel(Lt))o.why=`소등(${dm.latest})보다 늦어요`;
    o.ok=!o.why;return o});
  const f=ops.filter(o=>o.ok);
  const rec=f.filter(o=>o.sl>=state.goal&&o.sl<=600).sort((a,b)=>a.sl-b.sl)[0]||f.slice().sort((a,b)=>b.sl-a.sl)[0];
  if(rec)rec.rec=true;
  return ops;
}
function tagOf(o){
  if(!o.ok)return `<span class="tag no">불가</span>`;
  if(o.rec)return `<span class="tag rec">추천</span>`;
  if(o.sl>600)return `<span class="tag long">많이 길어요</span>`;
  if(o.sl>=state.goal)return `<span class="tag ok">충분</span>`;
  return `<span class="tag short">${dur(state.goal-o.sl)} 부족</span>`;
}
function wave(lie,lat,n,c,showEnds){
  const W=340,H=150,total=lat+n*c,L=34,R=W-14,x=m=>L+(R-L)*m/total,top=30,deep=82;
  let p=`M${L},${top} L${x(lat).toFixed(1)},${top}`;
  for(let i=0;i<n;i++){const s=lat+i*c,dp=deep*Math.max(.38,1-.14*i);for(let k=1;k<=24;k++){const t=k/24;p+=` L${x(s+c*t).toFixed(1)},${(top+dp*(1-Math.cos(2*Math.PI*t))/2).toFixed(1)}`}}
  let ends='';
  for(let i=1;i<=n;i++){const m=lat+i*c,X=x(m).toFixed(1),last=i===n;
    ends+=`<circle cx="${X}" cy="${top}" r="${last?5:3}" fill="${last?'#ffd98a':'#8fb4ff'}"/>`;
    if(showEnds||last)ends+=`<text x="${X}" y="${top-10}" text-anchor="${last?'end':'middle'}" font-size="${last?12:10}" fill="${last?'#ffd98a':'#97a0c6'}">${hm(lie+m)}</text>`}
  return `<svg class="wave" viewBox="0 0 ${W} ${H}" role="img" aria-label="수면 주기 그래프">
  <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb4ff" stop-opacity=".35"/><stop offset="1" stop-color="#8fb4ff" stop-opacity="0"/></linearGradient></defs>
  <text x="2" y="${top+4}" font-size="10" fill="#97a0c6">얕음</text><text x="2" y="${top+deep}" font-size="10" fill="#97a0c6">깊음</text>
  <path d="${p} L${R},${top+deep+8} L${L},${top+deep+8} Z" fill="url(#wg)"/>
  <path d="${p}" fill="none" stroke="#8fb4ff" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="${L}" cy="${top}" r="3" fill="#e8ebff"/><text x="${L}" y="${H-10}" font-size="11" fill="#e8ebff" text-anchor="start">${hm(lie)} 눕기</text>
  <text x="${R}" y="${H-10}" font-size="11" fill="#ffd98a" text-anchor="end">${hm(lie+total)} 기상</text>${ends}</svg>`;
}

/* ---------- 화면 ---------- */
const main=document.getElementById('main');
let view='calc',mode='wake',calcDate=null,calcWake=null,sel=null,logDate=null,logFeel=null;
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));({calc:vCalc,log:vLog,set:vSet})[view]()}

function vCalc(){
  const c=cycleNow(),e=estimate();
  let h=`<h2>${new Date().getHours()<5||new Date().getHours()>=18?'오늘 밤은 언제 잘까요?':'잠 계획 세우기'}</h2>
  <div class="seg">${[['wake','일어날 시간으로'],['now','지금 자면'],['nap','낮잠']].map(([k,l])=>`<button class="${mode===k?'on':''}" data-mode="${k}">${l}</button>`).join('')}</div>`;
  if(mode==='wake'){
    calcDate=calcDate||targetKey();const w=wakeFor(calcDate),wt=calcWake||w.t,wm=toMin(wt),nd=addDays(dateOf(calcDate),-1).getDay(),dm=dormFor(nd),ops=bedOpts(wm,nd);
    if(sel===null||!ops[sel]||!ops[sel].ok)sel=Math.max(0,ops.findIndex(o=>o.rec));
    const o=ops[sel];
    h+=`<section class="card"><div class="row sb"><button class="icon" data-act="dprev">‹</button><div style="text-align:center"><div class="small muted">${md(calcDate)}${w.label?' · '+esc(w.label):''} 기상</div><input type="time" class="bigin" id="wakeIn" value="${wt}"></div><button class="icon" data-act="dnext">›</button></div>
    ${calcWake&&calcWake!==w.t?`<div style="text-align:center"><button class="lnk" data-act="resetWake">설정한 시간(${w.t})으로</button></div>`:''}</section>
    <section class="card"><h3>이 시간에 누우세요</h3>
    ${ops.map((x,i)=>`<button class="opt${i===sel?' sel':''}${x.ok?'':' no'}${x.rec?' rec':''}" data-opt="${i}"><span class="t">${hm(x.lie)}</span><span>${x.n}주기 · ${dur(x.sl)} 잠<small>${x.why||`잠드는 ${state.latency}분 포함`}</small></span>${tagOf(x)}</button>`).join('')}
    ${o?wave(o.lie,state.latency,o.n,c,true):''}
    ${o&&o.ok?`<button class="btn pri full" data-act="plan">${hm(o.lie)}에 자고 ${wt}에 일어날게요</button>`:''}
    ${dm?`<p class="note">${NIGHT[nd]}요일 밤 기숙사 시간 적용: ${dm.earliest} 점호 끝 ~ ${dm.latest} 소등</p>`:''}
    <p class="note">주기 ${c}분 기준${state.auto&&e.ok?` (내 기록 ${e.n}개로 추정)`:state.auto?' · 기록이 쌓이면 내 주기로 바꿔 줘요':' (직접 설정)'}. 실제 주기는 사람마다, 밤마다 달라서 대략적인 시간이에요.</p></section>`;
  }else if(mode==='now'){
    const n0=nowMin(),tk=targetKey(),w=wakeFor(tk),allow=norm(toMin(w.t)-n0);
    const ops=[3,4,5,6].map(n=>{const sl=n*c,before=state.latency+sl;return {n,sl,wake:norm(n0+before),late:before>allow}});
    const best=ops.filter(o=>!o.late).pop();
    h+=`<section class="card"><div class="small muted" style="text-align:center">지금 ${hm(n0)}에 누우면</div><h3 style="text-align:center;margin-top:4px">이때 알람을 맞추세요</h3>

function chart7(){

function makeSample(){
  const s=fresh();state=s;const rnd=(a,b)=>a+Math.random()*(b-a);
  for(let i=21;i>=1;i--){const d=addDays(today(),-i+1),k=keyOf(d),w=d.getDay(),free=w===0||w===6;
    const bedM=free?norm(rnd(60,140)):norm(rnd(-50,40)),wakeM=free?rnd(560,640):390;
    const l={date:k,bed:hm(Math.round(bedM/5)*5),wake:hm(Math.round(wakeM/5)*5)};
    const S=sleepMin(l),r=S%95,dd=Math.min(r,95-r)+rnd(-8,8);l.feel=dd<16?3:dd>32?1:2;s.logs.push(l)}
}

    toggleEach(){if(state.wakeEach&&[2,3,4,5].some(i=>state.wake[i]!==state.wake[1])&&!confirm('평일을 한 번에 정하면 화~금이 월요일 시간으로 바뀌어요. 괜찮을까요?'))return;
      if(state.wakeEach)[2,3,4,5].forEach(i=>state.wake[i]=state.wake[1]);state.wakeEach=!state.wakeEach;save();render()},
    export(){download(new Blob([JSON.stringify(state)],{type:'application/json'}),`byeoljam-backup-${keyOf(today())}.json`);toast('백업 파일을 내보냈어요')},
    import(){document.getElementById('impF').click()},
    sample(){if(!confirm('지금 기록을 지우고 샘플 데이터로 바꿀까요?'))return;makeSample();save();toast('샘플 데이터를 넣었어요');go('log')},
    wipe(){if(!confirm('모든 기록과 설정을 지울까요?'))return;state=fresh();save();toast('모두 지웠어요');go('calc')}
  };
  if(A[d.act])A[d.act]();
});
main.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(t.id==='wakeIn'){calcWake=t.value||null;sel=null;return render()}
  if(t.id==='logDate'){logDate=t.value||keyOf(today());logFeel=null;return render()}
  if(d.wake!==undefined){if(t.value){state.wake[d.wake]=t.value;save()}return}
  if(d.wakeg){if(t.value){[1,2,3,4,5].forEach(i=>state.wake[i]=t.value);save()}return}
  if(d.dormOn){state.dorm[d.dormOn].on=t.checked;save();return render()}
  if(d.dorm){if(t.value){state.dorm[d.dorm][d.f]=t.value;save()}return}
  if(d.wen!==undefined){const n=+d.wen,a=state.dorm.weNights;state.dorm.weNights=t.checked?[...new Set(a.concat(n))]:a.filter(x=>x!==n);save();return render()}
  if(d.spw){const s=state.special.find(x=>x.date===d.spw);if(s&&t.value){s.wake=t.value;save()}return}
  if(d.set){const k=d.set;state[k]=k==='auto'?t.checked:(k==='earliest'||k==='latest')?t.value:+t.value;save();return render()}
  if(t.id==='impF'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.wake)throw 0;if(!confirm('지금 기록을 백업 내용으로 바꿀까요?'))return;state=Object.assign(fresh(),s);save();toast('불러왔어요');render()}catch(err){toast('올바른 백업 파일이 아니에요')}};r.readAsText(t.files[0]);t.value=''}
});
main.addEventListener('input',e=>{const t=e.target;if(t.type==='range'){const b=t.previousElementSibling&&t.previousElementSibling.querySelector('b');if(b)b.textContent=t.value+'분'}});
render();
</script>
</body>
</html>
