<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="옷장 노트">
<title>옷장 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ef;--card:#fff;--ink:#22201d;--ink2:#7b746c;--line:#e7e1d9;--accent:#3b4a8c;--accS:#e8ebf7;--rose:#d9766b;--warn:#c9802a;--warnS:#fbf0e0;--good:#3c8a5a;--goodS:#e4f2e9;--tipS:#eef0f8;
  --title:'Black Han Sans',sans-serif;--body:'Gowun Dodum',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.logo{font-family:var(--title);font-size:24px;letter-spacing:-.5px}
.logo i{font-style:normal;color:var(--accent)}
.icon{border:0;background:none;width:44px;height:44px;border-radius:50%;font-size:22px}
h2{font-family:var(--title);font-weight:400;font-size:28px;margin:6px 0 2px;letter-spacing:-.5px}
h3{font-size:17px;margin:0 0 8px}
h4{font-size:13px;color:var(--ink2);margin:14px 0 6px;font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.muted{color:var(--ink2)} .small{font-size:13px} .hint{font-size:13px;color:var(--ink2);margin:0 0 8px}
label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 5px}
.in{font:inherit;width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink)}
.btn{border:0;background:var(--accS);color:var(--accent);border-radius:12px;padding:11px 16px;font-size:15px;font-weight:700}
.btn.pri{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;border:1.5px dashed var(--line);color:var(--ink2);font-weight:400}
.btn.danger{background:#fbe6e3;color:#b8483b}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn{white-space:nowrap}.row>.btn.sm{flex:none}
.btn.full{width:100%;margin-top:10px}
.lnk{border:0;background:none;color:var(--accent);text-decoration:underline;font-size:13px;padding:2px 4px}
.row{display:flex;gap:8px;align-items:center} .row>.btn{flex:1} .sb{justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.hs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .chip{flex:none}
.subtabs{display:flex;gap:6px;margin:10px 0 2px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px}
.subtabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tag{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;background:var(--accS);color:var(--accent);margin-right:3px}
.tag.w{background:var(--warnS);color:var(--warn)} .tag.g{background:var(--goodS);color:var(--good)}
.banner{border-radius:14px;padding:11px 14px;margin:10px 0;font-size:14px;background:var(--accS)}
.banner.w{background:var(--warnS)}
/* 옷 그림 */
.it{position:relative;background:#faf8f5;border-radius:12px;overflow:hidden;aspect-ratio:1;display:grid;place-items:center}
.it img{width:100%;height:100%;object-fit:cover;display:block}
.it svg{width:82%;height:82%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{border:0;background:none;padding:0;text-align:left}
.cell small{display:block;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.cell .it .badge{position:absolute;left:5px;top:5px;font-size:10px;background:rgba(255,255,255,.9);border-radius:6px;padding:0 5px}
.cell.sel .it{outline:3px solid var(--accent);outline-offset:-3px}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);vertical-align:-2px}
.cols{display:flex;flex-wrap:wrap;gap:6px}
.cols button{width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0;position:relative}
.cols button.on{box-shadow:0 0 0 3px var(--ink)}
.cols button span{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;color:var(--ink2)}
.colwrap{padding-bottom:16px}
/* 코디 */
.fit{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.fit.n3{grid-template-columns:repeat(3,1fr)} .fit.n2{grid-template-columns:repeat(2,1fr)}
.oc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.oc .hd{display:flex;justify-content:space-between;align-items:center}
.oc .hd b{font-family:var(--title);font-weight:400;font-size:20px}
.res{display:flex;gap:8px;font-size:13px;padding:4px 0;align-items:flex-start}
.res i{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#fff;font-style:normal;margin-top:1px}
.res.g i{background:var(--good)} .res.t i{background:var(--accent)} .res.w i{background:var(--warn)}
.slot{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.slot:last-child{border:0}
.slot .it{width:72px}
.slot button.pick{border:1.5px dashed var(--line);background:none;border-radius:12px;width:72px;aspect-ratio:1;font-size:22px;color:var(--ink2)}
/* 날씨 */
.wx{display:flex;align-items:center;gap:14px}
.wx .t{font-family:var(--title);font-size:44px;line-height:1}
.wx small{display:block;color:var(--ink2);font-size:13px}
.guide{background:var(--bg);border-radius:12px;padding:8px 12px;font-size:14px;margin-top:10px}
/* 테스트 */
.q{margin:12px 0}
.q b{display:block;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:14px}
.opts button.on{border-color:var(--ink);background:#f1eee9}
.big{font-family:var(--title);font-size:32px;text-align:center;color:var(--accent);line-height:1.2}
.tip{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.tip:last-child{border:0}
.tip b{display:block}
.tip small{color:var(--ink2);font-size:13px}
.drape{border-radius:22px;padding:26px 26px 60px;display:flex;justify-content:center;transition:background .2s}
.drape .face{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.4);background:#ddd;display:grid;place-items:center;font-size:44px}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal span{width:44px;height:44px;border-radius:10px;display:block;border:1px solid rgba(0,0,0,.08)}
.mt{width:100%;border-collapse:collapse;font-size:14px}
.mt td,.mt th{padding:6px 4px;border-bottom:1px dashed var(--line);text-align:left}
.mt th{color:var(--ink2);font-weight:400;font-size:12px}
.mt input{width:70px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 6px}
.ok{color:var(--good)} .ng{color:var(--warn)}
#pv{width:100%;border-radius:12px;display:block;touch-action:manipulation;cursor:crosshair}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav .in2{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;padding:9px 0 12px;font-size:13px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button span{font-size:20px;filter:grayscale(1);opacity:.55}
.nav button.on{color:var(--ink);font-weight:700}
.nav button.on span{filter:none;opacity:1}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="app">
  <header><div class="logo">옷장 <i>노트</i></div><button class="icon" data-nav="set" aria-label="설정">⚙︎</button></header>
  <main id="main"></main>
</div>
<nav class="nav"><div class="in2"><button data-nav="today"><span>🌤️</span>오늘</button><button data-nav="closet"><span>👚</span>옷장</button><button data-nav="coord"><span>🧩</span>코디</button><button data-nav="me"><span>🪞</span>나</button></div></nav>
<div id="toast"></div>
<script>
/* ============ 유틸 ============ */
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateOf=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const TK=()=>keyOf(today());
const diffDays=(a,b)=>Math.round((dateOf(b)-dateOf(a))/864e5);
const DOW=['일','월','화','수','목','금','토'];
const md=k=>{const d=dateOf(k);return `${d.getMonth()+1}/${d.getDate()}`};
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
function toast(m,ms){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms||2600)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return (h>>>0)/4294967295};
const hex2rgb=h=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255]};
const rgb2hex=(r,g,b)=>'#'+[r,g,b].map(v=>pad(Math.max(0,Math.min(255,Math.round(v))).toString(16))).join('');
const shade=(h,a)=>{const[r,g,b]=hex2rgb(h);return rgb2hex(r+a,g+a,b+a)};
const lum=h=>{const[r,g,b]=hex2rgb(h);return (r*299+g*587+b*114)/1000};

/* ============ 기준 데이터 ============ */
// [이름, hex, 온도(w웜 c쿨 n중립), 베이직?, 계열]
const COL={black:['블랙','#1f1f1f','n',1,'mono'],charcoal:['차콜','#45484e','n',1,'mono'],gray:['그레이','#9a9ea4','c',1,'mono'],white:['화이트','#f8f8f6','c',1,'mono'],ivory:['아이보리','#f1e9d6','w',1,'mono'],
  beige:['베이지','#d8c29e','w',1,'earth'],camel:['카멜','#b5864f','w',1,'earth'],brown:['브라운','#6a4a33','w',1,'earth'],khaki:['카키','#77744e','w',1,'earth'],
  navy:['네이비','#22375b','c',1,'blue'],denim:['데님','#5272a0','c',1,'blue'],sky:['하늘','#a9c8e8','c',0,'blue'],blue:['블루','#2f5fb3','c',0,'blue'],
  mint:['민트','#a6dac5','c',0,'green'],green:['그린','#2f7d4a','n',0,'green'],yellow:['옐로','#f1d25e','w',0,'yellow'],mustard:['머스타드','#c69e2a','w',0,'yellow'],
  orange:['오렌지','#e8823a','w',0,'orange'],coral:['코랄','#ef8a76','w',0,'red'],red:['레드','#c8323a','n',0,'red'],burgundy:['버건디','#6c2433','c',0,'red'],
  pink:['핑크','#f3b5c7','c',0,'pink'],lavender:['라벤더','#c2b5e2','c',0,'purple'],purple:['퍼플','#694c92','c',0,'purple'],pattern:['패턴·멀티','#b9b2a8','n',0,'pattern']};
const NEAR={red:['pink','orange'],pink:['red','purple'],orange:['red','yellow'],yellow:['orange','green'],green:['yellow','blue'],blue:['green','purple'],purple:['blue','pink'],earth:['orange','yellow','green'],mono:[]};
const CATS={top:'상의',bottom:'하의',outer:'아우터',one:'원피스',shoes:'신발',bag:'가방',acc:'소품'};
const SUBS={top:['반팔 티','민소매','긴팔 티','셔츠','블라우스','맨투맨','후드','니트','조끼'],bottom:['청바지','슬랙스','면바지','트레이닝','반바지','스커트','레깅스'],
  outer:['가디건','바람막이','후드집업','자켓','블레이저','트렌치코트','야상','코트','패딩'],one:['원피스','점프수트'],shoes:['운동화','로퍼','구두','부츠','샌들·슬리퍼'],bag:['백팩','숄더백','크로스백','토트백'],acc:['모자','목도리','기타']};
const WARM0={'반팔 티':1,'민소매':1,'긴팔 티':1,'셔츠':1,'블라우스':1,'맨투맨':2,'후드':2,'니트':2,'조끼':1,'반바지':1,'레깅스':1,'가디건':1,'바람막이':1,'후드집업':1,'자켓':2,'블레이저':2,'트렌치코트':2,'야상':2,'코트':3,'패딩':3};
const FIT={slim:'슬림',reg:'정핏',over:'오버핏'},LEN={crop:'크롭',waist:'허리',hip:'엉덩이 덮음',long:'롱'},BFIT={skinny:'스키니·슬림',straight:'스트레이트',wide:'와이드',boot:'부츠컷',aline:'A라인 스커트',hline:'H라인 스커트',pleats:'플리츠 스커트'};
const WASH={machine:'세탁기',hand:'손세탁',dry:'드라이클리닝'};
const SEASON=['봄','여름','가을','겨울'];
const GUIDE=[[28,'민소매, 반팔, 반바지, 원피스'],[23,'반팔, 얇은 셔츠, 반바지, 면바지'],[20,'얇은 가디건, 긴팔 티, 면바지, 청바지'],[17,'얇은 니트, 맨투맨, 가디건, 청바지'],[12,'자켓, 가디건, 야상, 청바지, 면바지'],[9,'자켓, 트렌치코트, 야상, 니트'],[5,'코트, 가죽자켓, 히트텍, 니트'],[-99,'패딩, 두꺼운 코트, 목도리, 기모 제품']];
const CITY={서울:[37.5665,126.978],부산:[35.1796,129.0756],대구:[35.8714,128.6014],인천:[37.4563,126.7052],광주:[35.1595,126.8526],대전:[36.3504,127.3845],울산:[35.5384,129.3114],세종:[36.48,127.289],수원:[37.2636,127.0286],춘천:[37.8813,127.7298],강릉:[37.7519,128.8761],청주:[36.6424,127.489],전주:[35.8242,127.148],포항:[36.019,129.3435],창원:[35.2281,128.6811],제주:[33.4996,126.5312]};

/* ============ 저장 ============ */
const KEY='closet-v1';
const fresh=()=>({v:1,items:[],outfits:[],worn:{},body:{ans:{},done:false},pc:{ans:{},drape:{},done:false},style:[],sizes:{refs:[],brands:[],usual:'XS·가장 작은 사이즈'},loc:null,wx:null});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.items)return Object.assign(fresh(),s)}catch(e){}return fresh()}
let state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('저장 공간이 부족해요')}}
const itById=id=>state.items.find(i=>i.id===id);
const closet=()=>state.items.filter(i=>!i.wish);
const lastWorn=it=>(it.wears||[]).slice(-1)[0]||'';
const since=it=>{const l=lastWorn(it);return l?diffDays(l,TK()):diffDays(it.created||TK(),TK())+30};

const idb={p:null,open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('closet-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async tx(m,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('img',m);const r=fn(t.objectStore('img'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  put(k,v){return this.tx('readwrite',s=>s.put(v,k))},get(k){return this.tx('readonly',s=>s.get(k))},del(k){return this.tx('readwrite',s=>s.delete(k))},keys(){return this.tx('readonly',s=>s.getAllKeys())}};
const IC={};
async function img(k){if(!k)return null;if(IC[k])return IC[k];try{const v=await idb.get(k);if(v)IC[k]=v;return v}catch(e){return null}}
function loadImgs(root){(root||document).querySelectorAll('img[data-img]').forEach(async el=>{const u=await img(el.dataset.img);if(u&&el.isConnected)el.src=u})}
function loadImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
function scaleTo(im,max,q){const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function prepPhoto(file){const u=URL.createObjectURL(file);try{const im=await loadImage(u);return [scaleTo(im,1000,.82),scaleTo(im,360,.75)]}finally{URL.revokeObjectURL(u)}}

/* ============ 옷 그림 ============ */
function shapeSvg(it){
  const c=COL[it.color]||COL.gray,f=it.hex||c[1],st=lum(f)>200?'#b9b2a8':shade(f,-45),s=it.sub,cat=it.cat,pat=it.color==='pattern';
  const fill=pat?'url(#stp)':f;let p='',x='';
  const L=b=>({crop:58,waist:70,hip:82,long:96}[it.len]||b);
  if(cat==='top'||cat==='outer'){const B=L(cat==='outer'?84:76);

function suit(it,t,tmin){const w=it.warm||WARM0[it.sub]||2,s=it.sub;
  if(it.cat==='top'||it.cat==='one'){if(['반팔 티','민소매'].includes(s))return t>=21;if(w===1)return t>=15&&t<=27;if(w===2)return t>=-15&&t<=21;return t<=13}
  if(it.cat==='bottom'){if(s==='반바지')return t>=22;if(it.len==='crop'&&['aline','hline','pleats'].includes(it.bfit))return t>=14;if(w===1)return t>=13;if(w===2)return t<=26;return t<=10}
  if(it.cat==='outer'){if(w===1)return t>=10&&t<=22;if(w===2)return t>=4&&t<=17;return t<=8}
  if(it.cat==='shoes'){if(s==='샌들·슬리퍼')return t>=22;if(s==='부츠')return t<=12;return true}
  return true}
const needOuter=(t,tmin)=>t<24&&(t<=19||tmin<=12);
function recommend(t,tmin,seed){
  const C=closet(),ok=c=>C.filter(i=>i.cat===c&&suit(i,t,tmin));
  const tops=ok('top'),bots=ok('bottom'),ones=ok('one'),outs=needOuter(t,tmin)?ok('outer'):[],shoes=ok('shoes');
  let base=[];tops.forEach(a=>bots.forEach(b=>base.push([a,b])));ones.forEach(o=>base.push([o]));
  if(base.length>500)base=base.sort((a,b)=>hash(seed+a.map(i=>i.id).join())-hash(seed+b.map(i=>i.id).join())).slice(0,500);
  const fresh=its=>mean(its.map(i=>Math.min(since(i),14)/7));
  const scored=base.map(b=>{let items=b.slice();
    const best=(list)=>{let bi=null,bs=-1e9;list.forEach(o=>{const s=scoreOf(checkOutfit(items.concat(o)))+Math.min(since(o),14)/14;if(s>bs){bs=s;bi=o}});return bi};
    if(outs.length){const o=best(outs);if(o)items.push(o)}if(shoes.length){const s=best(shoes);if(s)items.push(s)}
    const r=checkOutfit(items);return {items,r,s:scoreOf(r)+fresh(items)*1.2+hash(seed+items.map(i=>i.id).join())*1.6}}).sort((a,b)=>b.s-a.s);
  const pick=[],used=new Set();for(const x of scored){if(used.has(x.items[0].id))continue;pick.push(x);used.add(x.items[0].id);if(pick.length===3)break}
  return {pick,missing:[!tops.length&&!ones.length?'이 날씨에 맞는 상의':'',!bots.length&&!ones.length?'하의':'',needOuter(t,tmin)&&!outs.length?'아우터':''].filter(Boolean)};
}

  main.innerHTML=`<div><button class="lnk" data-go="me">‹ 나</button></div><h2>체형 테스트</h2><p class="hint">거울 앞에서, 평소 느낌대로 골라 주세요.</p>
  ${BQ.map(([,q,opts],i)=>`<div class="card q"><b>${i+1}. ${q}</b><div class="opts">${opts.map(([,t],j)=>`<button class="${a[i]===j?'on':''}" data-bq="${i}" data-j="${j}">${t}</button>`).join('')}</div></div>`).join('')}
  <button class="btn pri full" data-act="bodySave">결과 보기</button>`}
async function vPcTest(){const a=state.pc.ans,d=state.pc.drape;R.di=R.di||0;const pair=DRAPES[R.di],sel=R.side||0;const face=await img('pcface');
  main.innerHTML=`<div><button class="lnk" data-go="me" data-sub="pc">‹ 나</button></div><h2>퍼스널 컬러 자가진단</h2>
  <h3 style="margin-top:12px">1. 질문</h3>${PCQ.map(([q,opts],i)=>`<div class="card q"><b>${q}</b><div class="opts">${opts.map(([,t],j)=>`<button class="${a[i]===j?'on':''}" data-pq="${i}" data-j="${j}">${t}</button>`).join('')}</div></div>`).join('')}
  <h3 style="margin-top:18px">2. 색 대 보기 (${R.di+1} / ${DRAPES.length})</h3><p class="hint">자연광에서 맨얼굴 정면 사진이 가장 좋아요. 두 색을 번갈아 보며 얼굴이 더 환하고 매끈해 보이는 쪽을 고르세요.</p>
  <label style="margin-top:0">얼굴 사진 ${face?'바꾸기':'올리기'} <small>(선택 · 이 폰에만 저장)</small></label><input type="file" accept="image/*" id="faceIn" class="in">
  <div class="drape" style="background:${pair[sel][1]}">${face?`<img class="face" src="${face}" alt="내 얼굴">`:'<div class="face">🙂</div>'}</div>

  <p class="hint" style="margin-top:10px;text-align:center">어느 쪽이 더 나아요?</p>
  <div class="row"><button class="btn sm ${d[R.di]===0?'pri':''}" data-dv="0">${pair[0][0]}</button><button class="btn sm ${d[R.di]===2?'pri':''}" data-dv="2">비슷해요</button><button class="btn sm ${d[R.di]===1?'pri':''}" data-dv="1">${pair[1][0]}</button></div>
  <button class="btn pri full" data-act="pcSave">결과 보기</button>`}

/* ----- 설정 ----- */
function vSet(){
  main.innerHTML=`<h2>설정</h2>
  <section class="card"><h3>날씨 지역</h3><p class="hint">지금: ${state.loc?esc(state.loc.name):'없음'}</p><div class="chips">${Object.keys(CITY).map(c=>`<button class="chip ${state.loc&&state.loc.name===c?'on':''}" data-city="${c}">${c}</button>`).join('')}</div>
  <button class="btn full" data-act="geo">📍 현재 위치 쓰기</button><p class="hint" style="margin-top:6px">날씨는 Open-Meteo 무료 날씨 서비스에서 가져와요.</p></section>
  <section class="card"><h3>백업</h3><p class="hint">옷 사진까지 파일 하나로 내보내요.</p><div class="row"><button class="btn" data-act="export">내보내기</button><button class="btn" data-act="import">불러오기</button></div><input type="file" id="impF" accept=".json,application/json" hidden></section>
  <section class="card"><h3>둘러보기</h3><p class="hint">옷 22벌짜리 샘플 옷장을 넣어요. 지금 옷장은 지워져요.</p><button class="btn full" data-act="sample">샘플 옷장 넣기</button></section>
  <section class="card"><h3>초기화</h3><button class="btn danger full" data-act="wipe">모두 지우기</button></section>`;
}

/* ============ 샘플 ============ */
function makeSample(){const T=today(),I=(cat,sub,color,o)=>Object.assign({id:uid(),cat,sub,color,name:'',fit:'reg',len:'',bfit:'',warm:WARM0[sub]||2,seasons:[],wash:'machine',memo:'',img:'',wish:false,created:keyOf(addDays(T,-90)),wears:[]},o||{});
  const items=[I('top','긴팔 티','white',{len:'hip'}),I('top','셔츠','sky',{len:'hip'}),I('top','셔츠','pattern',{name:'줄무늬 셔츠',len:'hip',fit:'over'}),I('top','맨투맨','gray',{fit:'over',len:'hip'}),I('top','니트','ivory',{len:'waist'}),I('top','니트','navy',{len:'waist',warm:3}),
    I('top','후드','charcoal',{fit:'over',len:'hip'}),I('top','반팔 티','black',{len:'hip'}),I('top','블라우스','pink',{len:'waist'}),I('bottom','청바지','denim',{bfit:'straight'}),I('bottom','슬랙스','beige',{bfit:'wide'}),I('bottom','슬랙스','black',{bfit:'straight'}),
    I('bottom','스커트','charcoal',{bfit:'pleats',len:'waist'}),I('bottom','면바지','khaki',{bfit:'wide'}),I('bottom','반바지','denim',{}),I('outer','가디건','beige',{len:'waist'}),I('outer','자켓','navy',{len:'hip',name:'네이비 블레이저'}),
    I('outer','트렌치코트','camel',{len:'long'}),I('outer','패딩','black',{len:'hip'}),I('shoes','운동화','white',{}),I('shoes','로퍼','brown',{}),I('bag','백팩','black',{}),
    I('top','니트','coral',{wish:true,price:39000,len:'waist',name:'코랄 니트'})];
  items.forEach((it,i)=>{if(it.wish)return;const n=[0,3,9,1,0,6,2,0,1,5,3,2,1,0,0,4,2,1,0,8,2,6][i]||0;for(let k=0;k<n;k++)it.wears.push(keyOf(addDays(T,-(k*6+(i%5)+1))));it.wears.sort()});
  state=Object.assign(fresh(),{items,body:{ans:{0:1,1:1,2:1,3:0,4:1,5:1,6:1,7:2,8:1,9:0},done:true},pc:{ans:{0:1,1:1,2:1,3:1,4:1,5:1},drape:{0:1,1:1,2:1,3:1,4:1,5:1,6:0,7:0},done:true},style:['캐주얼','미니멀'],loc:state.loc,wx:state.wx});
  state.outfits.push({id:uid(),name:'무난한 등교룩',items:[items[0].id,items[9].id,items[15].id,items[19].id],created:keyOf(addDays(T,-3))});save()}

/* ============ 이벤트 ============ */
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)));
function keepForm(){main.querySelectorAll('[data-fi]').forEach(el=>R.d[el.dataset.fi]=el.value)}
const newItem=wish=>({id:uid(),cat:'top',sub:'긴팔 티',color:'white',hex:'',name:'',fit:'reg',len:'hip',bfit:'',warm:0,seasons:[],wash:'machine',memo:'',img:'',imgData:null,wish:!!wish,price:'',created:TK(),wears:[]});
main.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.go){return go(d.go,d.sub?{sub:d.sub}:{})}
  if(d.sub){R.sub=d.sub;return render()}
  if(d.day!==undefined){R.day=+d.day;R.seed=0;return render()}
  if(d.cat){R.cat=d.cat;return render()}
  if(d.item&&R.v!=='build'){return go('item',{id:d.item})}
  if(d.wear){const k=keyOf(addDays(today(),R.day||0));const ids=d.wear.split(',');(state.worn[k]||[]).forEach(id=>{const it=itById(id);if(it)it.wears=(it.wears||[]).filter(x=>x!==k)});
    state.worn[k]=ids;ids.forEach(id=>{const it=itById(id);if(it){it.wears=(it.wears||[]).filter(x=>x!==k).concat(k).sort()}});save();toast(`${R.day?'내일':'오늘'} 입을 옷으로 기록했어요`);if(R.v==='coord')return go('today');return render()}
  if(d.fcat){keepForm();R.d.cat=d.fcat;R.d.sub=SUBS[d.fcat][0];R.d.fit='reg';R.d.len=d.fcat==='top'?'hip':d.fcat==='outer'?'hip':'';R.d.bfit=d.fcat==='bottom'?'straight':'';R.d.warm=0;return render()}
  if(d.fsub){keepForm();R.d.sub=d.fsub;R.d.warm=0;if(d.fsub==='스커트'){R.d.bfit='aline';R.d.len='waist'}else if(R.d.cat==='bottom'){R.d.len='';if(['aline','hline','pleats'].includes(R.d.bfit))R.d.bfit='straight'}return render()}
  if(d.fcol){keepForm();R.d.color=d.fcol;R.d.hex='';return render()}
  if(d.ff){keepForm();R.d[d.ff]=d.ff==='warm'?+d.v:d.v;return render()}
  if(d.fsea){keepForm();const a=R.d.seasons,i=a.indexOf(d.fsea);i>=0?a.splice(i,1):a.push(d.fsea);return render()}
  if(d.slot){R.pick=d.slot;render();setTimeout(()=>{const g=main.querySelectorAll('.card')[1];g&&g.scrollIntoView({behavior:'smooth'})},30);return}
  if(d.pickit){R.b.name=(document.getElementById('bName')||{}).value||R.b.name;const s=R.pick;R.b.slots[s]=d.pickit;if(s==='one'){delete R.b.slots.top;delete R.b.slots.bottom}if(s==='top'||s==='bottom')delete R.b.slots.one;R.pick=null;return render()}
  if(d.clr){R.b.name=(document.getElementById('bName')||{}).value||R.b.name;delete R.b.slots[d.clr];return render()}
  if(d.card){const o=state.outfits.find(x=>x.id===d.card);if(o)makeCard(o);return}
  if(d.editfit){const o=state.outfits.find(x=>x.id===d.editfit);const slots={};o.items.forEach(id=>{const it=itById(id);if(it)slots[it.cat]=id});return go('build',{b:{id:o.id,name:o.name,slots}})}
  if(d.bq!==undefined){state.body.ans[d.bq]=+d.j;save();t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));return}
  if(d.pq!==undefined){state.pc.ans[d.pq]=+d.j;save();t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));return}
  if(d.side!==undefined){R.side=+d.side;const y=scrollY;await render();scrollTo(0,y);return}
  if(d.dv!==undefined){state.pc.drape[R.di]=+d.dv;save();if(R.di<DRAPES.length-1){R.di++;R.side=0}const y=scrollY;await render();scrollTo(0,y);return}
  if(d.ref){R.ref=d.ref;R.cmp={};return render()}
  if(d.delbrand!==undefined){state.sizes.brands.splice(+d.delbrand,1);save();return render()}
  if(d.style){const a=state.style,i=a.indexOf(d.style);i>=0?a.splice(i,1):a.push(d.style);save();return render()}
  if(d.city){state.loc={name:d.city,lat:CITY[d.city][0],lng:CITY[d.city][1]};state.wx=null;save();toast(`${d.city} 날씨로 추천할게요`);return go('today')}
  const A=ACT[d.act];if(A)A(t);
});
const ACT={
  setManual(){const v=parseFloat(document.getElementById('manT').value);if(isNaN(v)){toast('숫자를 넣어 주세요');return}R.manual=v;R.seed=0;render()},
  clearManual(){R.manual=null;render()},reroll(){R.seed=(R.seed||0)+1;render()},
  unwear(){const k=keyOf(addDays(today(),R.day||0));(state.worn[k]||[]).forEach(id=>{const it=itById(id);if(it)it.wears=(it.wears||[]).filter(x=>x!==k)});delete state.worn[k];save();render()},
  newItem(){go('iform',{d:newItem(R.sub==='wish'),back:'closet',sub0:R.sub})},
  iformBack(){const id=R.d.id;itById(id)?go('item',{id}):go('closet',{sub:R.sub0})},
  noPhoto(){keepForm();R.d.imgData=null;R.d.dropImg=true;R.d.img='';R.d.hex='';render()},
  async saveItem(){keepForm();const it=R.d;const isNew=!itById(it.id);if(!it.warm)it.warm=WARM0[it.sub]||2;
    if(it.imgData){const id=it.img||uid();const [full,th]=it._pair||[it.imgData,it.imgData];await idb.put('f'+id,full);await idb.put('t'+id,th);IC['f'+id]=full;IC['t'+id]=th;it.img=id}
    const rec=Object.assign({},it);delete rec.imgData;delete rec._pair;delete rec.dropImg;rec.price=rec.price?+String(rec.price).replace(/[^\d]/g,''):'';
    if(isNew)state.items.push(rec);else Object.assign(itById(it.id),rec);save();toast('저장했어요');go('item',{id:it.id})},
  editItem(){const it=JSON.parse(JSON.stringify(itById(R.id)));go('iform',{d:it})},
  async delItem(){if(!confirm('이 옷을 삭제할까요?'))return;const it=itById(R.id);if(it.img){try{await idb.del('f'+it.img);await idb.del('t'+it.img)}catch(e){}}
    state.items=state.items.filter(i=>i.id!==R.id);state.outfits.forEach(o=>o.items=o.items.filter(x=>x!==R.id));save();go('closet')},
  wornToday(){const it=itById(R.id),k=TK();if(!(it.wears||[]).includes(k)){it.wears=(it.wears||[]).concat(k).sort();save();toast('기록했어요')}render()},
  bought(){const it=itById(R.id);it.wish=false;it.created=TK();save();toast('옷장으로 옮겼어요');render()},
  buildWith(){const it=itById(R.id);go('build',{b:{slots:{[it.cat]:it.id},name:''}})},
  newBuild(){go('build',{b:{slots:{},name:''}})},
  closePick(){R.pick=null;render()},
  saveBuild(){const ids=Object.values(R.b.slots);if(ids.length<2){toast('옷을 두 개 이상 골라 주세요');return}const name=document.getElementById('bName').value.trim();
    if(R.b.id){Object.assign(state.outfits.find(o=>o.id===R.b.id),{name,items:ids})}else state.outfits.push({id:uid(),name,items:ids,created:TK()});save();toast('룩북에 저장했어요');go('coord')},
  delBuild(){if(!confirm('이 코디를 삭제할까요?'))return;state.outfits=state.outfits.filter(o=>o.id!==R.b.id);save();go('coord')},
  bodySave(){if(Object.keys(state.body.ans).length<BQ.length){toast(`${BQ.length-Object.keys(state.body.ans).length}개 질문이 남았어요`);return}state.body.done=true;save();go('me',{sub:'body'})},
  pcSave(){if(Object.keys(state.pc.ans).length<4&&Object.keys(state.pc.drape).length<4){toast('질문이나 색 비교를 조금 더 해 주세요');return}state.pc.done=true;save();go('me',{sub:'pc'})},
  addRef(){const n=document.getElementById('refName').value.trim();if(!n){toast('이름을 넣어 주세요');return}const r={id:uid(),name:n,cat:document.getElementById('refCat').value,m:{}};state.sizes.refs.push(r);save();R.ref=r.id;R.cmp={};render()},
  delRef(){state.sizes.refs=state.sizes.refs.filter(r=>r.id!==R.ref);R.ref=null;save();render()},
  addBrand(){const b=document.getElementById('bB').value.trim();if(!b)return;state.sizes.brands.push({brand:b,size:document.getElementById('bS').value.trim(),memo:document.getElementById('bM').value.trim()});save();render()},
  geo(){if(!navigator.geolocation){toast('이 브라우저는 위치를 못 써요');return}navigator.geolocation.getCurrentPosition(p=>{state.loc={name:'현재 위치',lat:+p.coords.latitude.toFixed(3),lng:+p.coords.longitude.toFixed(3)};state.wx=null;save();toast('현재 위치 날씨로 추천할게요');go('today')},()=>toast('위치를 가져오지 못했어요. 지역을 골라 주세요'))},
  async export(){const imgs={};try{for(const k of await idb.keys())imgs[k]=await idb.get(k)}catch(e){}download(new Blob([JSON.stringify({app:'closet',state,imgs})],{type:'application/json'}),`closet-backup-${TK()}.json`);toast('백업 파일을 내보냈어요')},
  import(){document.getElementById('impF').click()},
  sample(){if(!confirm('지금 옷장을 지우고 샘플 옷장으로 바꿀까요?'))return;makeSample();toast('샘플 옷장을 넣었어요');go('today')},
  async wipe(){if(!confirm('모든 옷과 기록을 지울까요?'))return;try{for(const k of await idb.keys())await idb.del(k)}catch(e){}for(const k in IC)delete IC[k];state=fresh();save();go('today')}
};
main.addEventListener('change',async e=>{const t=e.target,d=t.dataset;
  if(t.id==='photoIn'&&t.files[0]){keepForm();try{const pair=await prepPhoto(t.files[0]);R.d.imgData=pair[0];R.d._pair=pair;R.d.hex='';render()}catch(err){toast('사진을 읽지 못했어요')}return}
  if(t.id==='faceIn'&&t.files[0]){try{const [f]=await prepPhoto(t.files[0]);await idb.put('pcface',f);IC.pcface=f;render()}catch(err){toast('사진을 읽지 못했어요')}return}
  if(t.id==='usual'){state.sizes.usual=t.value;save();return}
  if(d.rm){const r=state.sizes.refs.find(x=>x.id===R.ref);r.m[d.rm]=t.value;save();const y=scrollY;render();scrollTo(0,y);return}
  if(d.cm){R.cmp=R.cmp||{};R.cmp[d.cm]=t.value;const y=scrollY;render();scrollTo(0,y);return}
  if(t.id==='impF'&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());if(j.app!=='closet')throw 0;if(!confirm('지금 기록을 백업 내용으로 바꿀까요?'))return;
    try{for(const k of await idb.keys())await idb.del(k)}catch(_){}for(const [k,v] of Object.entries(j.imgs||{}))await idb.put(k,v);for(const k in IC)delete IC[k];state=Object.assign(fresh(),j.state);save();toast('불러왔어요');go('today')}catch(err){toast('올바른 백업 파일이 아니에요')}t.value=''}
});
render();
</script>
