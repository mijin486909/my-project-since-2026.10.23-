<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe6d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여행 스크랩북">
<title>여행 스크랩북</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--paper:#efe6d6;--paper2:#fbf7ef;--ink:#3d342b;--ink2:#85786a;--line:#ddd0bb;--accent:#c8643b;--teal:#3f7f78;--sea:#d6e5e4;--land:#fbf6ec;
  --hand:'Nanum Pen Script',cursive;--body:'Gowun Dodum',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--paper);background-image:radial-gradient(rgba(120,90,50,.07) 1px,transparent 1px),radial-gradient(rgba(120,90,50,.05) 1px,transparent 1px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;
  color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.hand{font-family:var(--hand)}
h1.title{font-family:var(--hand);font-size:46px;margin:6px 0 0;line-height:1;font-weight:400}
h2.vt{font-family:var(--hand);font-size:38px;margin:4px 0 0;line-height:1.05;font-weight:400}
h3{font-size:16px;margin:0 0 10px}
.muted{color:var(--ink2)} .small{font-size:13px} .hint{font-size:13px;color:var(--ink2);margin:0 0 8px}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 4px}
.in{font:inherit;width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink)}
input[type=date],input[type=datetime-local],input[type=time]{-webkit-appearance:none;appearance:none;min-height:42px;display:block;max-width:100%}
.ta{font-family:var(--hand);font-size:24px;line-height:1.3;width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;color:var(--ink);resize:vertical;min-height:90px}
.btn{border:1.5px solid var(--ink);background:#fff;border-radius:12px;padding:10px 16px;box-shadow:0 2px 0 var(--ink);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.pri{background:var(--accent);border-color:#8f4325;color:#fff;box-shadow:0 2px 0 #8f4325}
.btn.ghost{border:1.5px dashed var(--line);box-shadow:none;background:transparent;color:var(--ink2)}
.btn.danger{border-color:#b5523b;color:#b5523b;box-shadow:0 2px 0 #b5523b}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.full{width:100%;margin-top:12px}
.lnk{border:0;background:none;color:var(--teal);text-decoration:underline;font-size:13px;padding:2px 4px}
.row{display:flex;gap:8px;align-items:center} .row>.btn{flex:1} .sb{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;font-size:14px}
.seg button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chip.x:after{content:" ×";opacity:.6}
.badge{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid currentColor;margin-right:4px}
.badge.dom{color:var(--teal)} .badge.ab{color:var(--accent)}
.back{margin:2px 0 -2px}
/* 목록 */
.trip{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:14px 4px;border-bottom:1px dashed var(--line)}
.tpol{background:#fff;padding:6px 6px 16px;box-shadow:0 2px 6px rgba(60,40,20,.2);transform:rotate(-3deg);position:relative}
.trip:nth-child(even) .tpol{transform:rotate(2.5deg)}
.tpol img,.tpol .ph{width:84px;height:84px;object-fit:cover;display:block;background:repeating-linear-gradient(45deg,#f1e7d6 0 8px,#ebdfca 8px 16px)}
.tpol .ph{display:grid;place-items:center;font-size:30px}
.tape{position:absolute;width:56px;height:16px;background:rgba(242,193,182,.8);top:-8px;left:50%;transform:translateX(-50%) rotate(-4deg)}
.trip b{font-family:var(--hand);font-size:30px;font-weight:400;line-height:1.05;display:block}
.trip small{display:block;color:var(--ink2);font-size:13px}
.empty{color:var(--ink2);text-align:center;padding:30px 10px}
.empty b{display:block;font-family:var(--hand);font-size:30px;font-weight:400;color:var(--ink)}
/* 여행 화면 */
.th{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px -2px 4px;padding:2px;scrollbar-width:none;position:sticky;top:0;z-index:3;background:var(--paper)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 15px;font-size:14px}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.addrow{display:flex;gap:8px;margin:10px 0}
.addrow>*{flex:1}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;font-size:0;cursor:pointer}
.dayh{font-family:var(--hand);font-size:26px;margin:18px 0 4px;display:flex;align-items:baseline;gap:8px}
.dayh small{font-family:var(--body);font-size:12px;color:var(--ink2)}
.ent{display:grid;grid-template-columns:64px 1fr;gap:12px;width:100%;text-align:left;background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;align-items:center}
.ent img,.ent .ph{width:64px;height:64px;border-radius:8px;object-fit:cover;display:grid;place-items:center;background:#f3ead9;font-size:24px}
.ent .m{font-family:var(--hand);font-size:22px;line-height:1.15;display:block}
.ent small{display:block;color:var(--ink2);font-size:12px}
.big{width:100%;border-radius:10px;display:block;background:#eee}
.stk{display:flex;gap:4px;flex-wrap:wrap}
.stk button{font-size:24px;width:42px;height:42px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:0}
.stk button.on{border-color:var(--accent);background:#fbe6dc}
/* 지도 */
.mapw{position:relative}
.map{width:100%;height:auto;display:block;border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none;border:1px solid var(--line);background:var(--sea)}
.map .w{fill:var(--land);stroke:#b9a88f;stroke-width:.8;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.map .mu{fill:var(--land);stroke:#cdbda3;stroke-width:.6;vector-effect:non-scaling-stroke}
.map .pv{fill:none;stroke:#9c8a70;stroke-width:1.2;vector-effect:non-scaling-stroke}
.map .rg{stroke:#b9a88f;stroke-width:.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.map .rg.sel{stroke:var(--ink);stroke-width:2.2}
.mctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.mctl button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:20px;line-height:1;padding:0}
.stats{display:flex;gap:8px;margin:10px 0}
.stats div{flex:1;background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stats b{display:block;font-family:var(--hand);font-size:28px;font-weight:400;line-height:1.1}
.stats small{font-size:11px;color:var(--ink2)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid #b9a88f}
.sheet{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none;background:#eee}
.clist{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:6px}
.clist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #f0e8da;background:none;padding:8px 10px;font-size:14px}
/* 경비 */
.exp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed var(--line);padding:9px 0}
.exp b{font-weight:400}
.exp small{grid-column:1;color:var(--ink2);font-size:12px}
.exp .a{grid-row:1/3;grid-column:2;align-self:center;font-variant-numeric:tabular-nums;text-align:right}
.exp .a small{display:block}
.bar{display:grid;grid-template-columns:70px 1fr 90px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar i{display:block;height:10px;border-radius:5px;background:var(--accent)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tr{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:15px}
.tr b{font-weight:700}
.tr .amt{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.bal{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
/* 준비 */
.prog{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;background:var(--teal)}
.chk{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line)}
.chk input{width:22px;height:22px;accent-color:var(--teal);flex:none}
.chk span{flex:1}
.chk.done span{text-decoration:line-through;color:var(--ink2)}
/* 스크랩북 */
.book{background-color:#e9dabf;background-image:radial-gradient(rgba(110,80,40,.09) 1px,transparent 1.2px),radial-gradient(rgba(255,255,255,.25) 1px,transparent 1.2px);background-size:6px 6px,9px 9px;
  border-radius:6px;padding:18px 14px 30px;box-shadow:0 3px 12px rgba(60,40,20,.18);margin-top:10px;overflow:hidden}
.cover{text-align:center;padding:62px 8px 10px;position:relative}
.cover .yr{font-size:12px;letter-spacing:3px;color:var(--ink2)}
.cover h2{font-family:var(--hand);font-weight:400;font-size:56px;line-height:.95;margin:6px 0 4px}
.cover .dt{font-family:var(--hand);font-size:24px;color:#6d5e4e}
.stamp{position:absolute;right:2px;top:-4px;width:72px;height:72px;border:2.5px double var(--accent);color:var(--accent);border-radius:50%;display:grid;place-items:center;text-align:center;font-size:12px;line-height:1.2;transform:rotate(-14deg);opacity:.85;font-weight:700}
.ticket{display:flex;background:#fffdf6;margin:16px 4px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);position:relative;transform:rotate(-.8deg)}
.ticket:before,.ticket:after{content:"";position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#e9dabf;transform:translateY(-50%)}
.ticket:before{left:-8px}.ticket:after{right:-8px}
.ticket div{flex:1;text-align:center;padding:10px 2px;border-left:1.5px dashed #d8c9ae}
.ticket div:first-child{border:0}
.ticket b{display:block;white-space:nowrap;font-family:var(--hand);font-size:20px;font-weight:400;line-height:1}
.ticket small{font-size:10px;color:var(--ink2);letter-spacing:.5px}
.doodle{background:#fffdf6;margin:14px 10px 4px;padding:8px;box-shadow:0 1px 4px rgba(0,0,0,.12);transform:rotate(1deg);position:relative}
.doodle svg{width:100%;height:auto;display:block}
.doodle .lb{font-family:var(--hand);font-size:20px;position:absolute;left:12px;top:4px;color:#6d5e4e}
.bday{font-family:var(--hand);font-size:30px;display:inline-block;background:rgba(185,215,201,.9);padding:0 16px;transform:rotate(-1.5deg);margin:26px 0 2px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bday small{font-size:22px;color:#4b6b62}
.bp{position:relative;width:80%;margin:22px 0}
.bp.l{margin-left:3%} .bp.r{margin-left:17%}
.bp .pol{background:#fff;padding:9px 9px 12px;box-shadow:0 3px 8px rgba(60,40,20,.22);position:relative}
.bp .pol img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#efe7d8}
.bp .tp{position:absolute;width:86px;height:22px;top:-11px;left:50%;transform:translateX(-50%) rotate(-3deg);opacity:.85}
.cap{font-family:var(--hand);font-size:25px;line-height:1.15;margin-top:7px;color:#3d342b;word-break:keep-all}
.meta{font-size:11px;color:var(--ink2);margin-top:2px}
.bp .st{position:absolute;font-size:36px;right:-14px;bottom:-14px;transform:rotate(14deg);filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.note{background:#fff6b3;padding:14px 16px 16px;font-family:var(--hand);font-size:25px;line-height:1.2;box-shadow:0 3px 6px rgba(60,40,20,.18);width:72%;margin:22px 0 22px 14%;transform:rotate(1.6deg);position:relative;word-break:keep-all}
.note .meta{font-family:var(--body)}
.stamps{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}
.stamps span{border:2px dashed var(--teal);color:var(--teal);border-radius:50%;width:78px;height:78px;display:grid;place-items:center;font-size:12px;text-align:center;line-height:1.2;padding:4px;transform:rotate(var(--r));font-weight:700}
.bend{font-family:var(--hand);font-size:30px;text-align:center;margin-top:28px}
#cardOut img{width:100%;border-radius:10px;margin-top:10px;display:block}
/* 공통 */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav .in2{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;padding:10px 0 13px;font-family:var(--hand);font-size:25px;color:var(--ink2);position:relative}
.nav button.on{color:var(--ink)}
.nav button.on:after{content:"";position:absolute;left:30%;right:30%;bottom:8px;height:3px;border-radius:2px;background:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@media print{
  @page{margin:10mm}
  body{background:#fff}
  .nav,#toast,.noprint{display:none!important}
  .app{padding:0;max-width:none}
  .book{box-shadow:none}
  .bp,.note,.ticket,.doodle,.cover{break-inside:avoid}
}
</style>
</head>
<body>
<div class="app"><main id="main"></main></div>
<nav class="nav noprint"><div class="in2"><button data-nav="home">여행</button><button data-nav="conq">정복 지도</button><button data-nav="set">설정</button></div></nav>
<div id="toast"></div>
<script>
/* ===================== 유틸 ===================== */
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateOf=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const TK=()=>keyOf(today());
const diffDays=(a,b)=>Math.round((dateOf(b)-dateOf(a))/864e5);
const DOW=['일','월','화','수','목','금','토'];
const isoLocal=d=>`${keyOf(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dk=t=>t.slice(0,10), tm=t=>t.slice(11,16);
const md=k=>{const d=dateOf(k);return `${d.getMonth()+1}.${d.getDate()} (${DOW[d.getDay()]})`};
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const num=n=>(+n).toLocaleString('ko-KR',{maximumFractionDigits:2});
const flag=a=>a&&/^[A-Z]{2}$/.test(a)?String.fromCodePoint(...[...a].map(c=>127397+c.charCodeAt(0))):'';
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
function toast(m,ms){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms||2600)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function hav(a,b){const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r,x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const TAPES=['rgba(242,193,182,.85)','rgba(185,215,201,.9)','rgba(245,224,163,.9)','rgba(198,205,234,.9)','rgba(230,195,223,.9)'];
const STICKERS=['❤️','⭐','😋','📸','🌊','⛰️','🍜','☕','🎡','✈️','🚄','🌸','⛩️','🏖️'];
const CATS=['식비','교통','숙소','관광','쇼핑','기타'];
const CUR={JP:'JPY',US:'USD',CN:'CNY',TW:'TWD',HK:'HKD',MO:'MOP',VN:'VND',TH:'THB',SG:'SGD',PH:'PHP',MY:'MYR',ID:'IDR',GB:'GBP',AU:'AUD',CA:'CAD',NZ:'NZD',CH:'CHF',GU:'USD',MN:'MNT',LA:'LAK',KH:'USD',IN:'INR',TR:'TRY',CZ:'CZK',HU:'HUF',
  FR:'EUR',DE:'EUR',IT:'EUR',ES:'EUR',PT:'EUR',NL:'EUR',BE:'EUR',AT:'EUR',GR:'EUR',FI:'EUR',IE:'EUR',HR:'EUR',SI:'EUR',SK:'EUR',EE:'EUR',LV:'EUR',LT:'EUR',LU:'EUR',MT:'EUR',CY:'EUR'};

/* ===================== 저장 ===================== */
const KEY='scrapbook-v1';
const fresh=()=>({v:1,trips:[],entries:[],expenses:[],packs:{},manual:{dom:[],w:[]}});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.trips)return Object.assign(fresh(),s)}catch(e){}return fresh()}
let state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('저장 공간이 부족해요. 설정에서 백업을 내보내 주세요.')}}
const tripById=id=>state.trips.find(t=>t.id===id);
const entryById=id=>state.entries.find(e=>e.id===id);
const tripEntries=id=>state.entries.filter(e=>e.trip===id).sort((a,b)=>a.t<b.t?-1:a.t>b.t?1:0);

const idb={p:null,
  open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('scrapbook-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('img',mode);const r=fn(t.objectStore('img'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  put(k,v){return this.tx('readwrite',s=>s.put(v,k))},get(k){return this.tx('readonly',s=>s.get(k))},del(k){return this.tx('readwrite',s=>s.delete(k))},keys(){return this.tx('readonly',s=>s.getAllKeys())}};
const IC={};
async function img(k){if(!k)return null;if(IC[k])return IC[k];try{const v=await idb.get(k);if(v&&k[0]==='t')IC[k]=v;return v}catch(e){return null}}

function loadImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
function scaleTo(im,max,q){const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function prepPhoto(file){const u=URL.createObjectURL(file);try{const im=await loadImage(u);return [scaleTo(im,1600,.82),scaleTo(im,420,.75)]}finally{URL.revokeObjectURL(u)}}
async function readExif(file){
  try{const v=new DataView(await file.slice(0,262144).arrayBuffer());
    if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return {};
    let o=2;
    while(o+10<v.byteLength){const m=v.getUint16(o);if((m&0xFF00)!==0xFF00||m===0xFFDA)break;
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return tiff(v,o+10);
      o+=2+v.getUint16(o+2)}
  }catch(e){}
  return {};
}
function tiff(v,s){
  const le=v.getUint16(s)===0x4949,u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le);
  const ifd=p=>{const r={};if(p+2>v.byteLength)return r;const n=u16(p);for(let i=0;i<n;i++){const e=p+2+i*12;if(e+12>v.byteLength)break;r[u16(e)]={n:u32(e+4),o:e+8}}return r};
  const str=x=>{if(!x)return '';const p=x.n<=4?x.o:s+u32(x.o);let t='';for(let i=0;i<x.n&&p+i<v.byteLength;i++){const c=v.getUint8(p+i);if(!c)break;t+=String.fromCharCode(c)}return t};
  const rat=x=>{const p=s+u32(x.o),a=[];for(let i=0;i<3;i++){const d=u32(p+i*8+4);a.push(d?u32(p+i*8)/d:0)}return a};
  const out={},I0=ifd(s+u32(s+4));
  try{if(I0[0x8769]){const E=ifd(s+u32(I0[0x8769].o));out.time=str(E[0x9003])||str(E[0x9004])}
    if(!out.time&&I0[0x132])out.time=str(I0[0x132]);
    if(I0[0x8825]){const G=ifd(s+u32(I0[0x8825].o));if(G[2]&&G[4]){const la=rat(G[2]),lo=rat(G[4]);let lat=la[0]+la[1]/60+la[2]/3600,lng=lo[0]+lo[1]/60+lo[2]/3600;
      if(str(G[1])==='S')lat=-lat;if(str(G[3])==='W')lng=-lng;if(lat||lng){out.lat=+lat.toFixed(6);out.lng=+lng.toFixed(6)}}}}catch(e){}
  const m=(out.time||'').match(/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/);out.time=m?`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}`:null;
  return out;
}

const GEO={};
function geo(n){return GEO[n]||(GEO[n]=fetch('data/'+n+'.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{d.f.forEach(f=>f.bb=f.b.map(v=>v/d.s));return d}).catch(e=>{delete GEO[n];throw e}))}
function pip(f,s,lon,lat){if(lon<f.bb[0]||lon>f.bb[2]||lat<f.bb[1]||lat>f.bb[3])return false;const X=lon*s,Y=lat*s;let ins=false;
  for(const r of f.c)for(let i=0,j=r.length-2;i<r.length;j=i,i+=2){const xi=r[i],yi=r[i+1],xj=r[j],yj=r[j+1];if((yi>Y)!==(yj>Y)&&X<(xj-xi)*(Y-yi)/(yj-yi)+xi)ins=!ins}return ins}
function nearest(d,lon,lat,mx){let best=null,bd=mx*mx;const s=d.s;for(const f of d.f){if(lon<f.bb[0]-mx||lon>f.bb[2]+mx||lat<f.bb[1]-mx||lat>f.bb[3]+mx)continue;for(const r of f.c)for(let i=0;i<r.length;i+=2){const dx=r[i]/s-lon,dy=r[i+1]/s-lat,q=dx*dx+dy*dy;if(q<bd){bd=q;best=f}}}return best}
const inKR=(lat,lng)=>lng>124&&lng<132&&lat>33&&lat<38.9;
async function regionOf(lat,lng){
  try{if(inKR(lat,lng)){const m=await geo('kr_muni');const f=m.f.find(f=>pip(f,m.s,lng,lat))||nearest(m,lng,lat,.06);if(f)return {n:f.n,p:f.p}}
    const w=await geo('world');const f=w.f.find(f=>pip(f,w.s,lng,lat))||nearest(w,lng,lat,.4);return f?{a:f.a,n:f.n}:null}catch(e){return null}
}
const rgName=r=>r?(r.p?r.n:flag(r.a)+' '+r.n):'';
const PATHS={};
function paths(name,d,cos){const k=name+cos;if(PATHS[k])return PATHS[k];const s=d.s;
  return PATHS[k]=d.f.map(f=>f.c.map(r=>{let p='';for(let i=0;i<r.length;i+=2)p+=(i?'L':'M')+(r[i]/s*cos).toFixed(4)+' '+(-r[i+1]/s).toFixed(4);return p+'Z'}).join(''))}
const cosOf=lat=>Math.max(.2,Math.round(Math.cos(lat*Math.PI/180)*20)/20);
async function baseLayers(cos,withKR){
  const w=await geo('world');let h=paths('world',w,cos).map((p,i)=>withKR&&w.f[i].a==='KR'?'':`<path class="w" d="${p}"/>`).join('');
  if(withKR){const m=await geo('kr_muni'),k=await geo('kr');h+=paths('kr_muni',m,cos).map(p=>`<path class="mu" d="${p}"/>`).join('')+paths('kr',k,cos).map(p=>`<path class="pv" d="${p}"/>`).join('')}
  return h;
}
class GMap{
  constructor(host,o){this.o=o;this.W=360;this.H=o.h||400;this.cos=o.cos;
    host.innerHTML=`<div class="mapw"><svg class="map" viewBox="0 0 ${this.W} ${this.H}" role="img" aria-label="지도"><defs><clipPath id="cpc"><circle r="15"/></clipPath></defs><g class="z">${o.layers}</g><g class="ov"></g></svg><div class="mctl noprint"><button data-z="1" aria-label="확대">+</button><button data-z="-1" aria-label="축소">−</button></div></div>`;
    this.svg=host.querySelector('svg');this.z=this.svg.querySelector('.z');this.ov=this.svg.querySelector('.ov');this.fit(o.fit);this.bind(host)}
  fit([a,b,c,d]){const w=Math.max(c-a,.02)*this.cos,h=Math.max(d-b,.02);this.k=Math.min(this.W/w,this.H/h)*(this.o.pad||.84);this.tx=this.W/2-(a+c)/2*this.cos*this.k;this.ty=this.H/2+(b+d)/2*this.k;this.apply()}
  apply(){this.z.setAttribute('transform',`translate(${this.tx.toFixed(2)} ${this.ty.toFixed(2)}) scale(${this.k})`);if(this.o.draw)this.ov.innerHTML=this.o.draw(this)}
  scr(lon,lat){return [lon*this.cos*this.k+this.tx,-lat*this.k+this.ty]}
  geo(x,y){return [(x-this.tx)/this.k/this.cos,-(y-this.ty)/this.k]}
  zoomAt(f,x,y){const k2=Math.max(.5,Math.min(this.k*f,3e5)),r=k2/this.k;this.tx=x-(x-this.tx)*r;this.ty=y-(y-this.ty)*r;this.k=k2;this.apply()}
  pt(e){const r=this.svg.getBoundingClientRect();return [(e.clientX-r.left)*this.W/r.width,(e.clientY-r.top)*this.H/r.height]}
  bind(host){const P=new Map();let moved=0,pd=null;const sv=this.svg;
    sv.addEventListener('pointerdown',e=>{try{sv.setPointerCapture(e.pointerId)}catch(_){}P.set(e.pointerId,this.pt(e));if(P.size===1)moved=0;if(P.size===2){const[a,b]=[...P.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1]);moved=99}});
    sv.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const p=this.pt(e),q=P.get(e.pointerId);
      if(P.size===1){const dx=p[0]-q[0],dy=p[1]-q[1];moved+=Math.abs(dx)+Math.abs(dy);if(moved>6){this.tx+=dx;this.ty+=dy;this.apply()}P.set(e.pointerId,p)}
      else{P.set(e.pointerId,p);const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)this.zoomAt(d/pd,(a[0]+b[0])/2,(a[1]+b[1])/2);pd=d}});
    const up=e=>{if(!P.has(e.pointerId))return;const p=P.get(e.pointerId);P.delete(e.pointerId);if(P.size<2)pd=null;
      if(e.type==='pointerup'&&P.size===0&&moved<=6&&this.o.tap){const g=this.geo(p[0],p[1]);this.o.tap(g[0],g[1],p)}};
    sv.addEventListener('pointerup',up);sv.addEventListener('pointercancel',up);
    sv.addEventListener('wheel',e=>{e.preventDefault();const p=this.pt(e);this.zoomAt(e.deltaY<0?1.25:.8,p[0],p[1])},{passive:false});
    host.querySelectorAll('[data-z]').forEach(b=>b.addEventListener('click',()=>this.zoomAt(+b.dataset.z>0?1.6:.625,this.W/2,this.H/2)));
  }
}
function bboxOf(pts,minSpan){let a=1e9,b=1e9,c=-1e9,d=-1e9;pts.forEach(p=>{a=Math.min(a,p.lng);c=Math.max(c,p.lng);b=Math.min(b,p.lat);d=Math.max(d,p.lat)});
  const ms=minSpan||.04;if(c-a<ms){const m=(a+c)/2;a=m-ms/2;c=m+ms/2}if(d-b<ms){const m=(b+d)/2;b=m-ms/2;d=m+ms/2}return [a,b,c,d]}
async function tripBBox(t){const pts=tripEntries(t.id).filter(e=>e.lat!=null);if(pts.length)return bboxOf(pts);
  if(t.kind==='abroad'&&(t.countries||[]).length){try{const w=await geo('world');const fs=w.f.filter(f=>t.countries.includes(f.a));if(fs.length){const bb=[Math.min(...fs.map(f=>f.bb[0])),Math.min(...fs.map(f=>f.bb[1])),Math.max(...fs.map(f=>f.bb[2])),Math.max(...fs.map(f=>f.bb[3]))];if(bb[2]-bb[0]<60)return bb}}catch(e){}}
  return [125.5,33.6,130,38.6]}

/* ----- 경비 ----- */
const krw=(x,t)=>x.cur==='KRW'?x.amt:(t.rate?x.amt*t.rate:null);
function settle(t){
  const es=state.expenses.filter(x=>x.trip===t.id),bal={};t.members.forEach(m=>bal[m]={paid:0,share:0});
  es.forEach(x=>{const v=krw(x,t);if(v==null)return;const who=(x.who&&x.who.length?x.who:t.members).filter(m=>bal[m]);if(!who.length||!bal[x.payer])return;bal[x.payer].paid+=v;who.forEach(m=>bal[m].share+=v/who.length)});
  const cr=[],db=[];Object.entries(bal).forEach(([m,b])=>{const d=Math.round((b.paid-b.share)/10)*10;if(d>0)cr.push([m,d]);else if(d<0)db.push([m,-d])});
  cr.sort((a,b)=>b[1]-a[1]);db.sort((a,b)=>b[1]-a[1]);const tr=[];let i=0,j=0;
  while(i<db.length&&j<cr.length){const v=Math.min(db[i][1],cr[j][1]);if(v>=10)tr.push([db[i][0],cr[j][0],v]);db[i][1]-=v;cr[j][1]-=v;if(db[i][1]<10)i++;if(cr[j][1]<10)j++}
  return {bal,tr};
}

function tripStats(t){const es=tripEntries(t.id),pts=es.filter(e=>e.lat!=null);let km=0;for(let i=1;i<pts.length;i++)km+=hav(pts[i-1],pts[i]);
  const regs=[...new Set(pts.map(e=>rgName(e.rg)).filter(Boolean))],ex=state.expenses.filter(x=>x.trip===t.id).reduce((s,x)=>s+(krw(x,t)||0),0);
  return {es,pts,km,regs,photos:es.filter(e=>e.img).length,ex}}
function doodle(pts,W,H){if(pts.length<2)return '';const c=cosOf(mean(pts.map(p=>p.lat))),bb=bboxOf(pts,.01),w=(bb[2]-bb[0])*c,h=bb[3]-bb[1],k=Math.min((W-40)/w,(H-40)/h);
  const P=pts.map(p=>[W/2+((p.lng-(bb[0]+bb[2])/2)*c)*k,H/2-(p.lat-(bb[1]+bb[3])/2)*k]);
  let d='M'+P[0].join(' ');for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i],mx=(a[0]+b[0])/2+(b[1]-a[1])*.18,my=(a[1]+b[1])/2-(b[0]-a[0])*.18;d+=` Q${mx.toFixed(1)} ${my.toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)}`}
  return `<svg viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="#c8643b" stroke-width="2.2" stroke-dasharray="5 5" stroke-linecap="round"/>${P.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===0||i===P.length-1?7:5}" fill="${i===0?'#3f7f78':i===P.length-1?'#c8643b':'#fff'}" stroke="#3d342b" stroke-width="1.5"/>`).join('')}
  <text x="${P[0][0].toFixed(1)}" y="${(P[0][1]+20).toFixed(1)}" font-family="Nanum Pen Script, cursive" font-size="18" text-anchor="middle" fill="#3f7f78">출발</text></svg>`}

function visits(){const V={mu:{},pr:{},w:{}},add=(o,k,id)=>(o[k]=o[k]||new Set()).add(id);
  for(const e of state.entries){const r=e.rg;if(!r)continue;if(r.p){add(V.mu,r.n,e.trip);add(V.pr,r.p,e.trip);add(V.w,'KR',e.trip)}else if(r.a)add(V.w,r.a,e.trip)}
  for(const t of state.trips){if(t.kind==='abroad')(t.countries||[]).forEach(a=>add(V.w,a,t.id));else add(V.w,'KR',t.id)}
  state.manual.dom.forEach(m=>{add(V.mu,m.n,'m');add(V.pr,m.p,'m')});state.manual.w.forEach(a=>add(V.w,a,'m'));return V}

function scene(label,h){const W=1200,H=900,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');

  x.fillStyle=`hsl(${(h+180)%360},80%,85%)`;x.beginPath();x.arc(W*.75,H*.28,90,0,7);x.fill();
  for(let i=0;i<3;i++){x.fillStyle=`hsla(${h+60+i*25},35%,${48-i*8}%,.85)`;x.beginPath();x.moveTo(0,H*(.62+i*.1));for(let X=0;X<=W;X+=40)x.lineTo(X,H*(.62+i*.1)+Math.sin(X/(120+i*50)+i*2)*30);x.lineTo(W,H);x.lineTo(0,H);x.fill()}

  return c}

  if(d.st!==undefined){R.d.st=R.d.st===d.st?'':d.st;main.querySelectorAll('[data-st]').forEach(b=>b.classList.toggle('on',b.dataset.st===R.d.st));return}
  if(d.place){const p=R._places[+d.place];R.pin={lat:p.lat,lng:p.lng,rg:p.rg};if(MAP){MAP.fit(bboxOf([p],.05))}const i=document.getElementById('pinfo');if(i)i.textContent='📍 '+p.n;return}
  if(d.exp){const x=state.expenses.find(y=>y.id===d.exp);return go('exp',{d:JSON.parse(JSON.stringify(x))})}
  if(d.cur){R.d.cur=d.cur;return render()}
  if(d.cat){R.d.cat=d.cat;main.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('on',b===t));return}
  if(d.payer){R.d.payer=d.payer;main.querySelectorAll('[data-payer]').forEach(b=>b.classList.toggle('on',b===t));return}
  if(d.who){const w=R.d.who,i=w.indexOf(d.who);i>=0?w.splice(i,1):w.push(d.who);t.classList.toggle('on',i<0);return}
  if(d.pkdel!==undefined){e.preventDefault();state.packs[R.id].splice(+d.pkdel,1);save();return render()}
  if(d.scope){R.scope=d.scope;R.cs=null;return render()}
  if(d.lvl){R.lvl=d.lvl;R.cs=null;return render()}
  if(d.manual!==undefined){const k=d.manual;if(R.scope==='w'){const a=state.manual.w;state.manual.w=a.includes(k)?a.filter(x=>x!==k):a.concat(k)}else{const a=state.manual.dom;state.manual.dom=a.some(m=>m.n===k)?a.filter(m=>m.n!==k):a.concat({n:k,p:d.p})}save();return render()}
  const A=ACT[d.act];if(A)A(t);
});
const ACT={
  toHome(){go('home')}, toTrip(){go('trip',{id:R.d?R.d.trip||R.d.id:R.id,tab:R.from||'rec'})}, toTripMoney(){go('trip',{id:R.d.trip,tab:'money'})},
  toEntry(){go('entry',{d:R.d,from:R.from})},
  newTrip(){go('tform',{d:newTripDraft()})},
  editTrip(){const t=tripById(R.id);go('tform',{d:Object.assign(newTripDraft(),JSON.parse(JSON.stringify(t)),{q:''}),from:R.tab})},
  addMem(){const i=document.getElementById('memIn'),v=i.value.trim();if(v&&!R.d.members.includes(v))R.d.members.push(v);render();setTimeout(()=>{const x=document.getElementById('memIn');x&&x.focus()},0)},
  saveTrip(){const D=R.d;D.title=D.title.trim();if(!D.title){toast('여행 이름을 넣어 주세요');return}if(!D.start){toast('출발 날짜를 넣어 주세요');return}
    if(!D.end||D.end<D.start)D.end=D.start;if(D.kind==='abroad'&&!D.countries.length){toast('나라를 하나 이상 골라 주세요');return}
    const rec={title:D.title,kind:D.kind,countries:D.kind==='abroad'?D.countries:[],start:D.start,end:D.end,money:D.money,members:D.members.length?D.members:['나'],cur:(D.cur||'').toUpperCase().trim(),rate:parseFloat(D.rate)||0};
    if(D.id){Object.assign(tripById(D.id),rec);save();go('trip',{id:D.id,tab:R.from||'rec'})}else{const t={id:uid(),cover:null,...rec};state.trips.push(t);save();go('trip',{id:t.id,tab:'rec'})}},
  async delTrip(){if(!confirm('이 여행의 기록, 사진, 지출이 모두 지워져요. 삭제할까요?'))return;const id=R.d.id;for(const x of state.entries.filter(x=>x.trip===id))await delImg(x.img);
    state.entries=state.entries.filter(x=>x.trip!==id);state.expenses=state.expenses.filter(x=>x.trip!==id);delete state.packs[id];state.trips=state.trips.filter(t=>t.id!==id);save();toast('삭제했어요');go('home')},
  newNote(){const t=tripById(R.id),T=TK(),day=T>=t.start&&T<=t.end?T:t.start,n=new Date();go('entry',{d:{id:uid(),trip:t.id,t:`${day}T${pad(n.getHours())}:${pad(n.getMinutes())}`,img:'',memo:'',place:'',st:''},from:'rec'})},
  setCover(){tripById(R.d.trip).cover=R.d.id;save();toast('표지로 정했어요');render()},
  clearLoc(){delete R.d.lat;delete R.d.lng;delete R.d.rg;render()},
  toPick(){go('pick',{d:R.d,from:R.from,pin:undefined})},
  pickOk(){if(!R.pin){toast('지도에서 위치를 눌러 주세요');return}Object.assign(R.d,{lat:R.pin.lat,lng:R.pin.lng,rg:R.pin.rg});
    if(R.from==='map'&&state.entries.some(x=>x.id===R.d.id)){Object.assign(entryById(R.d.id),{lat:R.d.lat,lng:R.d.lng,rg:R.d.rg});save();toast('위치를 정했어요');go('trip',{id:R.d.trip,tab:'map'})}else go('entry',{d:R.d,from:R.from})},
  saveEntry(){const x=R.d;if(!x.img&&!x.memo.trim()){toast('메모를 써 주세요');return}if(!x.t){toast('시간을 넣어 주세요');return}
    const i=state.entries.findIndex(y=>y.id===x.id);if(i>=0)state.entries[i]=x;else state.entries.push(x);save();toast('저장했어요');go('trip',{id:x.trip,tab:R.from==='map'?'map':'rec'})},
  async delEntry(){if(!confirm('이 기록을 삭제할까요?'))return;const x=R.d;await delImg(x.img);state.entries=state.entries.filter(y=>y.id!==x.id);const t=tripById(x.trip);if(t.cover===x.id)t.cover=null;save();go('trip',{id:x.trip,tab:'rec'})},
  newExp(){const t=tripById(R.id),T=TK();go('exp',{d:{id:uid(),trip:t.id,title:'',amt:'',cur:t.kind==='abroad'&&t.cur?t.cur:'KRW',cat:'식비',payer:t.members[0],who:t.members.slice(),date:T>=t.start&&T<=t.end?T:t.start}})},
  saveExp(){const x=R.d,a=parseFloat(String(x.amt).replace(/,/g,''));if(!x.title.trim()){toast('무엇에 썼는지 적어 주세요');return}if(!(a>0)){toast('금액을 넣어 주세요');return}
    if(tripById(x.trip).money==='split'&&!x.who.length){toast('나눠 낼 사람을 한 명 이상 골라 주세요');return}
    x.amt=a;x.title=x.title.trim();const i=state.expenses.findIndex(y=>y.id===x.id);if(i>=0)state.expenses[i]=x;else state.expenses.push(x);save();go('trip',{id:x.trip,tab:'money'})},
  delExp(){if(!confirm('이 지출을 삭제할까요?'))return;state.expenses=state.expenses.filter(y=>y.id!==R.d.id);save();go('trip',{id:R.d.trip,tab:'money'})},
  addPk(){const i=document.getElementById('pkIn'),v=i.value.trim();if(!v)return;state.packs[R.id].push({t:v,done:false});save();render();setTimeout(()=>{const x=document.getElementById('pkIn');x&&x.focus()},0)},
  resetPk(){state.packs[R.id].forEach(x=>x.done=false);save();render()},
  makeCard(){makeCard(tripById(R.id))}, print(){window.print()},
  async persist(){try{const ok=navigator.storage&&navigator.storage.persist?await navigator.storage.persist():false;toast(ok?'저장 공간을 지켜 두었어요':'브라우저가 허락하지 않았어요. 홈 화면에 추가해서 쓰면 더 안전해요.',3500)}catch(e){toast('이 브라우저에서는 안 돼요')}render()},
  async export(){toast('백업 파일 만드는 중…');const imgs={};try{for(const k of await idb.keys())imgs[k]=await idb.get(k)}catch(e){}
    download(new Blob([JSON.stringify({app:'scrapbook',state,imgs})],{type:'application/json'}),`scrapbook-backup-${TK()}.json`);toast('백업 파일을 내보냈어요')},
  import(){document.getElementById('impF').click()},
  async sample(){toast('샘플 여행 만드는 중…',6000);try{await makeSample();toast('샘플 여행 3개를 넣었어요');go('home')}catch(e){toast('샘플을 만들지 못했어요: 지도 데이터를 불러올 수 없어요')}},
  async unsample(){const ids=state.trips.filter(t=>t.sample).map(t=>t.id);for(const x of state.entries.filter(x=>ids.includes(x.trip)))await delImg(x.img);
    state.entries=state.entries.filter(x=>!ids.includes(x.trip));state.expenses=state.expenses.filter(x=>!ids.includes(x.trip));ids.forEach(i=>delete state.packs[i]);state.trips=state.trips.filter(t=>!t.sample);save();toast('샘플 여행을 지웠어요');render()},
  async wipe(){if(!confirm('모든 여행과 사진을 지울까요? 되돌릴 수 없어요.'))return;try{for(const k of await idb.keys())await idb.del(k)}catch(e){}for(const k in IC)delete IC[k];state=fresh();save();toast('모두 지웠어요');go('home')}
};
main.addEventListener('input',e=>{const t=e.target,d=t.dataset;
  if(d.d!==undefined){R.d[d.d]=t.value;if(d.d==='q'){clearTimeout(t._q);t._q=setTimeout(()=>{const pos=t.selectionStart;render();const n=main.querySelector('[data-d=q]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},250)}return}
  if(d.e!==undefined){R.d[d.e]=t.value;return}
  if(d.x!==undefined){R.d[d.x]=t.value;return}
});
main.addEventListener('change',async e=>{const t=e.target,d=t.dataset;
  if(t.id==='photoIn'&&t.files.length){const fs=[...t.files];t.value='';await addPhotos(fs,tripById(R.id));return}
  if(d.pk!==undefined){state.packs[R.id][+d.pk].done=t.checked;save();return render()}
  if(t.id==='impF'&&t.files[0]){const f=t.files[0];t.value='';try{const j=JSON.parse(await f.text());if(j.app!=='scrapbook'||!j.state)throw 0;
    if(!confirm('지금 기록을 백업 파일 내용으로 바꿀까요?'))return;try{for(const k of await idb.keys())await idb.del(k)}catch(_){}
    for(const [k,v] of Object.entries(j.imgs||{}))await idb.put(k,v);for(const k in IC)delete IC[k];state=Object.assign(fresh(),j.state);save();toast('불러왔어요');go('home')}catch(err){toast('올바른 백업 파일이 아니에요')}}
});
main.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='memIn'){e.preventDefault();ACT.addMem()}else if(e.target.id==='pkIn'){e.preventDefault();ACT.addPk()}}});
render();
</script>
</body>
