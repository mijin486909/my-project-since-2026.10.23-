<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="리허설">
<title>리허설 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#121116;--card:#1c1a21;--card2:#25222c;--line:#302d38;--ink:#f2efe9;--ink2:#9d97a6;--amber:#ffb84d;--red:#ff6b5b;--green:#6fd39a;--blue:#8ab4ff;
  --serif:'Gowun Batang',serif;--body:'Gowun Dodum',system-ui,sans-serif;--num:ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 90% 50% at 50% -8%,rgba(255,196,120,.17),transparent 70%),radial-gradient(ellipse 70% 40% at 50% 112%,rgba(120,90,200,.10),transparent 70%),var(--bg)}
body{background:transparent;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
.app{max-width:560px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;font-family:var(--serif);font-size:21px;font-weight:700}
.spot{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 50% 42%,#fff3d6,#ffb84d 52%,rgba(255,184,77,0) 72%);box-shadow:0 0 18px rgba(255,184,77,.45)}
.ib{border:1px solid var(--line);background:var(--card2);border-radius:10px;min-width:38px;height:38px;padding:0 10px;font-size:16px;flex:none}
.h1{font-family:var(--serif);font-size:30px;margin:10px 0 2px}
.h2{font-family:var(--serif);font-size:26px;margin:4px 0 2px;line-height:1.25;word-break:keep-all}
h3{font-size:16px;margin:0 0 10px}
.muted{color:var(--ink2)} .small{font-size:13px} .hint{font-size:13px;color:var(--ink2);margin:0 0 8px} .warn{color:var(--amber)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 4px}
.in{font:inherit;width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#15141a;color:var(--ink)}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:42px;display:block;color-scheme:dark;max-width:100%}
.ta{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#15141a;color:var(--ink);resize:vertical;line-height:1.6}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 16px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1d1406;font-weight:700}
.btn.big{padding:15px;font-size:17px}
.btn.ghost{background:transparent;border-style:dashed;color:var(--ink2)}
.btn.danger{color:var(--red);border-color:rgba(255,107,91,.45);background:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.full{width:100%;margin-top:10px}
.lnk{border:0;background:none;color:var(--blue);text-decoration:underline;font-size:13px;padding:2px 4px}
.row{display:flex;gap:8px;align-items:center} .row>.btn{flex:1} .sb{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:#15141a;border-radius:10px;padding:9px 4px;font-size:14px;color:var(--ink2);position:relative}
.seg button.on{background:var(--ink);color:#16151a;border-color:var(--ink);font-weight:700}
.seg button em{position:absolute;top:-9px;right:6px;font-style:normal;font-size:10px;background:var(--amber);color:#1d1406;border-radius:999px;padding:0 6px;font-weight:700}
.seg.sm button{padding:6px 2px;font-size:12px}
.sw{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;margin:12px 0 0}
.sw input{width:20px;height:20px;accent-color:var(--amber);flex:none}
.sw small{color:var(--ink2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#15141a;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--ink2)}
.chip.on{background:var(--amber);border-color:var(--amber);color:#1d1406}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px -2px 4px;padding:4px 2px;scrollbar-width:none;position:sticky;top:0;z-index:3;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;font-size:14px;color:var(--ink2)}
.tabs button.on{background:var(--ink);color:#16151a;border-color:var(--ink)}
.tabs small{font-size:11px;opacity:.75}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;font-size:0;cursor:pointer}
.back{margin:2px 0 -2px}
/* 목록 */
.tcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.tcard b{font-family:var(--serif);font-size:20px;word-break:keep-all}
.tcard small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.dday{font-size:12px;font-weight:700;color:#1d1406;background:var(--amber);border-radius:999px;padding:2px 9px;white-space:nowrap;flex:none}
.dday.past{background:var(--line);color:var(--ink2)}
.empty{color:var(--ink2);text-align:center;padding:26px 10px}
.empty b{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:4px}
/* 슬라이드 */
.stp{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;background:#15141a}
.stp button{border:0;background:none;width:44px;height:40px;font-size:20px}
.stp b{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:17px}
.sl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.sl-h{display:flex;gap:6px;align-items:center}
.sl-h .num{font-family:var(--num);font-weight:700;color:var(--amber);min-width:22px;text-align:center;flex:none}
.sl-h .ib{min-width:34px;height:38px;padding:0}
.sl-m{display:flex;gap:12px;align-items:center;margin-top:10px}
.th{width:116px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#2a2730;flex:none;border:1px solid var(--line)}
.tm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tm button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#15141a;font-size:18px;padding:0}
.tm b{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:20px;min-width:50px;text-align:center}
.pin{font-size:12px;color:var(--ink2);border:0;background:none;padding:2px;white-space:nowrap}
[data-pinw]{flex-basis:100%}
button.pin{color:var(--amber);text-decoration:underline}
details summary{cursor:pointer;font-size:13px;color:var(--ink2);margin-top:10px}
details .ta{margin-top:6px}
/* 리허설 */
body.livemode header{display:none}
body.livemode .app{padding:0;max-width:none}
.live{position:fixed;inset:0;background:#0b0a0e;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));touch-action:manipulation;user-select:none;-webkit-user-select:none;z-index:20}
.live.flash{animation:fl .7s}
@keyframes fl{0%{background:#4a1610}100%{background:#0b0a0e}}
.lv-top{display:flex;align-items:center;gap:8px;max-width:760px;width:100%;margin:0 auto}
.lv-n{font-family:var(--num);font-weight:700;color:var(--amber);white-space:nowrap}
.lv-tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recdot{color:var(--red);font-size:12px;white-space:nowrap;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.3}}
.lv-main{flex:1;display:flex;flex-direction:column;min-height:0;margin:10px auto 0;cursor:pointer;max-width:760px;width:100%}
.lv-img{width:100%;max-height:28vh;object-fit:contain;border-radius:8px;background:#000;flex:none}
.lv-big{font-family:var(--serif);font-size:28px;text-align:center;margin:18px 0 6px}
.lv-clock{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:10px;font-family:var(--num);font-variant-numeric:tabular-nums}
.lv-clock b{font-size:62px;line-height:1;font-weight:700}
.lv-clock span{color:var(--ink2);font-size:20px}
.near{color:var(--amber)} .over{color:var(--red)} .ok{color:var(--green)} .short{color:var(--blue)}
.lv-bar{height:8px;background:#24212b;border-radius:4px;overflow:hidden;margin:10px 0;flex:none}
.lv-bar i{display:block;height:100%;width:0;background:var(--green);border-radius:4px}
.lv-bar i.near{background:var(--amber)} .lv-bar i.over{background:var(--red)}
.lv-text{flex:1;overflow-y:auto;font-size:21px;line-height:1.65;padding:4px 2px;-webkit-overflow-scrolling:touch;word-break:keep-all}
.lv-text p{margin:0 0 12px}
.lv-text .kw{font-size:27px;line-height:1.5;color:#fff4dc}
.lv-foot{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--ink2);margin:8px auto;font-family:var(--num);max-width:760px;width:100%}
.lv-foot b{color:var(--ink)} .lv-foot b.over{color:var(--red)} .lv-foot b.near{color:var(--amber)} .lv-foot b.ok{color:var(--green)}
.lv-btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;max-width:760px;width:100%;margin:0 auto}
.lv-btns button{border:1px solid var(--line);background:var(--card2);border-radius:16px;padding:20px 0;font-size:18px}
.lv-btns .next{background:var(--amber);color:#1d1406;border-color:var(--amber);font-weight:700}
.lv-pause{position:absolute;inset:0;background:rgba(8,7,10,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.lv-pause b{font-size:30px} .lv-pause span{color:var(--ink2)}
/* 결과 */
.bigtime{text-align:center;margin:10px 0 4px}
.bigtime b{display:block;font-family:var(--num);font-size:56px;font-variant-numeric:tabular-nums;line-height:1.1}
.bigtime span{display:block;color:var(--ink2);font-size:14px}
.pb{display:grid;grid-template-columns:22px 1fr 82px;gap:8px;align-items:center;margin:9px 0}
.pn{font-family:var(--num);color:var(--ink2);text-align:center}
.pbl{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbb{position:relative;height:9px;background:#24212b;border-radius:5px;margin-top:4px}
.pbb i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:5px}
.pbb i.over{background:var(--red)}
.pbb u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);text-decoration:none}
.pt{font-family:var(--num);font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
.pt small{color:var(--ink2);font-size:11px}
.pt.over{color:var(--red)}
.stats{display:flex;gap:8px;margin:6px 0 10px}
.stats div{flex:1;background:#15141a;border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.stats b{display:block;font-family:var(--num);font-size:24px}
.stats small{font-size:11px;color:var(--ink2)}
.ev{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.mk{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed var(--line);padding:7px 0;font-size:14px;color:var(--ink)}
.mk span:last-child{color:var(--ink2);font-size:12px;white-space:nowrap}
.tl{width:100%;height:auto;display:block;background:#15141a;border-radius:10px;border:1px solid var(--line);margin-top:10px;cursor:pointer}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
audio{width:100%;margin-top:6px}
.adv{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.adv:last-child{border:0}
.adv span{color:var(--ink2);font-size:13px}
.adv .tip{color:var(--ink)}
.rrow{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed var(--line);padding:10px 0;font-size:14px}
.rrow:last-child{border:0}
.rrow .rn{color:var(--amber);font-family:var(--num);font-weight:700}
.rrow b{font-family:var(--num);font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.selfv{font-size:14px;line-height:1.8}
/* 질의응답 */
.qa{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.qa .q{font-weight:700;color:#fff4dc;word-break:keep-all}
.qa .a{margin-top:6px;font-size:14px;line-height:1.7;word-break:keep-all}
/* 당일 */
.dbig{font-family:var(--serif);font-size:44px;text-align:center;color:var(--amber);margin:8px 0 2px}
.tmap{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;align-items:center}
.tmap .at{font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--amber);font-weight:700}
.tmap small{color:var(--ink2);font-family:var(--num)}
.tmap.end{border:0;color:var(--ink2)}
.chk{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line);margin:0;color:var(--ink);font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--amber);flex:none}
.chk span{flex:1}
.chk.done span{text-decoration:line-through;color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#16151a;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="app">
  <header><button class="logo" id="home"><span class="spot"></span>리허설 노트</button><button class="ib" id="gear" aria-label="설정">⚙︎</button></header>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script>
/* ===================== 유틸 ===================== */
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateOf=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const TK=()=>keyOf(today());
const diffDays=(a,b)=>Math.round((dateOf(b)-dateOf(a))/864e5);
const DOW=['일','월','화','수','목','금','토'];
const md=k=>{const d=dateOf(k);return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`};
const ft=s=>{s=Math.round(s);const n=s<0;s=Math.abs(s);return (n?'-':'')+Math.floor(s/60)+':'+pad(s%60)};
const fd=s=>(Math.round(s)>=0?'+':'−')+ft(Math.abs(s));
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const isoLocal=d=>`${keyOf(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const syl=s=>((s||'').match(/[가-힣]/g)||[]).length+((s||'').match(/[A-Za-z]+|\d+/g)||[]).length;
const LV={1:'대본 전체',2:'키워드만',3:'아무것도 없이'};
function toast(m,ms){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms||2600)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}

/* ===================== 저장 ===================== */
const KEY='rehearsal-v1';
const fresh=()=>({v:1,talks:[],sound:true});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.talks)return Object.assign(fresh(),s)}catch(e){}return fresh()}
let state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('저장 공간이 부족해요. 설정에서 녹음을 지워 주세요.')}}
let sT;const saveSoon=()=>{clearTimeout(sT);sT=setTimeout(save,400)};
window.addEventListener('pagehide',save);
const talkById=id=>state.talks.find(t=>t.id===id);
const DEF_CHECK=['발표 파일을 USB와 클라우드 두 곳에 저장','PDF 버전도 따로 준비','포인터·건전지 확인','노트북 충전기·화면 연결 젠더','발표장 화면·마이크 미리 확인','물 챙기기','시작 전 첫 문장 소리 내어 말해 보기'];
const newSlide=()=>({id:uid(),title:'',kw:'',script:'',target:30,auto:true,img:null,src:''});
const newTalk=()=>({id:uid(),title:'새 발표',date:'',talkSec:420,qaSec:180,slides:[],qas:[],check:DEF_CHECK.map(t=>({t,done:false})),runs:[],level:0,rec:true});

const idb={p:null,
  open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('rehearsal-db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv',mode);const r=fn(t.objectStore('kv'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  put(k,v){return this.tx('readwrite',s=>s.put(v,k))},get(k){return this.tx('readonly',s=>s.get(k))},del(k){return this.tx('readwrite',s=>s.delete(k))},keys(){return this.tx('readonly',s=>s.getAllKeys())}};
const IC={};
async function img(k){if(!k)return null;if(IC[k])return IC[k];try{const v=await idb.get(k);if(v&&k[0]==='t')IC[k]=v;return v}catch(e){return null}}
function loadImgs(root){(root||document).querySelectorAll('img[data-img]').forEach(async el=>{const u=await img(el.dataset.img);if(u&&el.isConnected)el.src=u})}
function delImg(id){if(!id)return;delete IC['t'+id];idb.del('f'+id).catch(()=>{});idb.del('t'+id).catch(()=>{})}

/* ===================== 파일 읽기 ===================== */
async function unzip(buf,want){
  const v=new DataView(buf),u8=new Uint8Array(buf),td=new TextDecoder();let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){if(v.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0)throw new Error('zip');
  const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);const out={};
  for(let i=0;i<n;i++){
    if(v.getUint32(p,true)!==0x02014b50)throw new Error('zip');

const SHORT=/표지|목차|차례|감사|thank|q\s*&\s*a|질의|질문|참고\s*문헌|reference/i;
function distribute(t){
  const S=t.slides,autos=S.filter(s=>s.auto);if(!autos.length)return;
  const fixed=S.filter(s=>!s.auto).reduce((a,s)=>a+s.target,0);
  let rem=Math.max(autos.length*5,t.talkSec-fixed);rem=Math.round(rem/5)*5;
  const sc=autos.map(s=>syl(s.script)).filter(x=>x>0).sort((a,b)=>a-b),medS=sc.length>=2?sc[Math.floor(sc.length/2)]:0;
  const w=autos.map(s=>{const L=syl(s.script)||medS||(s.kw?syl(s.kw)*3:0)||Math.min(200,syl(s.src))*.6||20;let x=30+L;if(SHORT.test(s.title||'')||(S.indexOf(s)===0&&!s.script))x=Math.min(x,30);return x});
  const W=w.reduce((a,b)=>a+b,0);const tg=w.map(x=>Math.max(5,Math.round(rem*x/W/5)*5));
  let diff=rem-tg.reduce((a,b)=>a+b,0),guard=0;
  while(diff!==0&&guard++<1000){const st=diff>0?5:-5;let j=0;for(let k=1;k<tg.length;k++)if(diff>0?tg[k]*1>tg[j]:tg[k]>tg[j])j=k;if(tg[j]+st<5)break;tg[j]+=st;diff-=st}
  autos.forEach((s,k)=>s.target=tg[k]);
}

  if(!E||E.length<40)return null;const s=E.slice().sort((a,b)=>a-b),p10=s[Math.floor(s.length*.1)],p90=s[Math.floor(s.length*.9)];

function liveAct(a){

  if(d.seek!==undefined){const a=document.getElementById('au');if(a){a.currentTime=+d.seek;a.play().catch(()=>{})}return}
  if(d.self){R.d.run.self[d.self]=+d.v;t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));return}
  if(d.stuck){const a=R.d.run.stuck,i=a.indexOf(d.stuck);i>=0?a.splice(i,1):a.push(d.stuck);t.classList.toggle('on',i<0);return}
  const T=talkById(R.id);
  if(T&&d.lvset){T.level=+d.lvset;save();t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));return}
  if(T&&d.stp){T[d.stp]=Math.max(d.stp==='qaSec'?0:30,T[d.stp]+(+d.d));if(d.stp==='talkSec')distribute(T);save();return render()}
  const card=t.closest('[data-sid]'),S=card&&T&&T.slides.find(s=>s.id===card.dataset.sid);
  if(S&&d.tadj){S.target=Math.max(5,S.target+(+d.tadj));S.auto=false;distribute(T);save();return updateTimes(T)}
  if(S&&d.unpin){S.auto=true;distribute(T);save();return updateTimes(T)}
  if(S&&d.mv){const i=T.slides.indexOf(S),j=i+(+d.mv);if(j<0||j>=T.slides.length)return;[T.slides[i],T.slides[j]]=[T.slides[j],T.slides[i]];save();return render()}
  if(S&&d.sdel){if((S.script||S.img)&&!confirm('이 슬라이드를 삭제할까요?'))return;T.slides.splice(T.slides.indexOf(S),1);delImg(S.img);distribute(T);save();return render()}
  if(T&&d.qe){R.qe=d.qe;return render()}
  if(T&&d.ckdel!==undefined){e.preventDefault();T.check.splice(+d.ckdel,1);save();return render()}
  const A=ACT[d.act];if(A)A(t);
});
const ACT={
  home(){go('home')}, backRec(){go('talk',{id:R.id,tab:'rec'})},
  newTalk(){const t=newTalk();state.talks.push(t);save();go('talk',{id:t.id,tab:'sl'})},
  start(){startRun(talkById(R.id))},
  addSlide(){const T=talkById(R.id);T.slides.push(newSlide());distribute(T);save();render();setTimeout(()=>{const els=main.querySelectorAll('[data-sf=title]');const x=els[els.length-1];if(x){x.focus();x.scrollIntoView({block:'center'})}},0)},
  redist(){const T=talkById(R.id);T.slides.forEach(s=>s.auto=true);distribute(T);save();render();toast('시간을 다시 나눴어요')},
  delTalk(){const T=talkById(R.id);if(!confirm(`'${T.title}' 발표를 삭제할까요? 슬라이드와 리허설 기록, 녹음이 모두 지워져요.`))return;T.slides.forEach(s=>delImg(s.img));T.runs.forEach(r=>{idb.del('r'+r.id).catch(()=>{});idb.del('e'+r.id).catch(()=>{})});state.talks=state.talks.filter(x=>x!==T);save();go('home')},
  async saveRun(){const D=R.d,T=talkById(R.id);try{if(D.blob)await idb.put('r'+D.run.id,{type:D.blob.type,buf:await D.blob.arrayBuffer()});if(D.E)await idb.put('e'+D.run.id,D.E)}catch(e){D.run.rec=false;toast('녹음을 저장하지 못했어요. 기록만 저장할게요.')}
    T.runs.push(D.run);save();if(D.url)URL.revokeObjectURL(D.url);toast('기록을 저장했어요');go('talk',{id:T.id,tab:'rec'})},
  discardRun(){if(!confirm('이 리허설 기록을 버릴까요?'))return;if(R.d.url)URL.revokeObjectURL(R.d.url);go('talk',{id:R.id,tab:'sl'})},
  delRun(){const T=talkById(R.id);if(!confirm('이 리허설 기록을 삭제할까요?'))return;idb.del('r'+R.rid).catch(()=>{});idb.del('e'+R.rid).catch(()=>{});T.runs=T.runs.filter(r=>r.id!==R.rid);save();go('talk',{id:T.id,tab:'rec'})},
  delRec(){const T=talkById(R.id),r=T.runs.find(x=>x.id===R.rid);if(!confirm('녹음만 지울까요? 시간 기록과 분석은 남아요.'))return;idb.del('r'+r.id).catch(()=>{});r.rec=false;save();render()},
  addQa(){const T=talkById(R.id),q={id:uid(),q:'',a:''};T.qas.push(q);R.qe=q.id;save();render();setTimeout(()=>{const x=main.querySelector('[data-qf=q]');if(x){x.focus();x.scrollIntoView({block:'center'})}},0)},
  qaEx(){const T=talkById(R.id);T.qas=T.qas.concat(QA_EX.map(([q,a])=>({id:uid(),q,a,ex:true})));save();render();toast('예시 질문 10개를 넣었어요')},
  qaDone(){const T=talkById(R.id),q=T.qas.find(x=>x.id===R.qe);if(q&&!q.q.trim()&&!q.a.trim())T.qas=T.qas.filter(x=>x!==q);R.qe=null;save();render()},
  qaDel(){const T=talkById(R.id);T.qas=T.qas.filter(x=>x.id!==R.qe);R.qe=null;save();render()},
  addCk(){const T=talkById(R.id),i=document.getElementById('ckIn'),v=i.value.trim();if(!v)return;T.check.push({t:v,done:false});save();render()},
  async sample(){toast('예시 발표 만드는 중…');const t=await makeSample();toast('예시 발표를 넣었어요');go('talk',{id:t.id,tab:'sl'})},
  async delRecs(){if(!confirm('녹음 파일을 모두 지울까요? 시간 기록과 분석은 남아요.'))return;try{for(const k of await idb.keys())if(String(k)[0]==='r')await idb.del(k)}catch(e){}state.talks.forEach(t=>t.runs.forEach(r=>r.rec=false));save();toast('녹음을 모두 지웠어요');render()},
  async export(){toast('백업 파일 만드는 중…');const withRec=document.getElementById('withRec')&&document.getElementById('withRec').checked,kv={};
    try{for(const k of await idb.keys()){const c=String(k)[0];if(c==='r'&&!withRec)continue;const v=await idb.get(k);if(c==='r')kv[k]={type:v.type,b64:await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(new Blob([v.buf],{type:v.type}))})};else kv[k]=v}}catch(e){}
    const st=JSON.parse(JSON.stringify(state));st.talks.forEach(t=>t.runs.forEach(r=>{if(r.rec&&!kv['r'+r.id])r.rec=false}));
    download(new Blob([JSON.stringify({app:'rehearsal',state:st,kv})],{type:'application/json'}),`rehearsal-backup-${TK()}.json`);toast('백업 파일을 내보냈어요')},
  import(){document.getElementById('impF').click()},
  async wipe(){if(!confirm('모든 발표와 기록, 녹음을 지울까요? 되돌릴 수 없어요.'))return;try{for(const k of await idb.keys())await idb.del(k)}catch(e){}for(const k in IC)delete IC[k];state=fresh();save();toast('모두 지웠어요');go('home')}
};
main.addEventListener('input',e=>{const t=e.target,d=t.dataset,T=talkById(R.id);
  if(T&&d.tf){T[d.tf]=t.value;saveSoon();return}
  if(T&&d.sf){const S=T.slides.find(s=>s.id===t.closest('[data-sid]').dataset.sid);if(S){S[d.sf]=t.value;saveSoon()}return}
  if(T&&d.qf){const q=T.qas.find(x=>x.id===R.qe);if(q){q[d.qf]=t.value;saveSoon()}return}
  if(d.memo&&R.d){R.d.run.memo=t.value}
});
main.addEventListener('change',async e=>{const t=e.target,d=t.dataset,T=talkById(R.id);
  if(T&&d.sf){distribute(T);save();updateTimes(T);if(d.sf==='script'){const sm=t.closest('details')&&t.closest('details').querySelector('summary');if(sm)sm.textContent='대본'+(t.value?` · ${syl(t.value)}자`:' 쓰기')}return}
  if(T&&d.tf){save();if(d.tf==='title'||d.tf==='date')render();return}
  if(T&&d.opt){T[d.opt]=t.checked;save();return}
  if(d.gs){state[d.gs]=t.checked;save();return}
  if(T&&d.ck!==undefined){T.check[+d.ck].done=t.checked;save();return render()}
  if(T&&t.id==='pdfIn'&&t.files[0]){const f=t.files[0];t.value='';const msg=m=>{const el=document.getElementById('impMsg');if(el)el.textContent=m};msg('PDF 읽는 중…');
    try{const pages=await readPdf(await f.arrayBuffer(),(i,n)=>msg(`PDF 읽는 중… ${i} / ${n}쪽`));if(!pages.length)throw new Error('empty');let added=0;
      for(let i=0;i<pages.length;i++){const p=pages[i],id=uid();await idb.put('f'+id,p.full);await idb.put('t'+id,p.thumb);IC['t'+id]=p.thumb;let s=T.slides[i];if(!s){s=newSlide();T.slides.push(s);added++}delImg(s.img);s.img=id;if(!s.title&&p.title)s.title=p.title;if(p.text)s.src=p.text}
      distribute(T);save();R.msg=`✓ ${pages.length}쪽을 불러왔어요${added?` (새 슬라이드 ${added}장)`:''}. 제목은 가장 큰 글씨로 추정했어요.`;render()}
    catch(err){msg(err&&err.message==='pdfjs'?'PDF 읽기 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.':'PDF를 읽지 못했어요. 다른 파일로 해 보세요.')}return}
  if(T&&t.id==='pptIn'&&t.files[0]){const f=t.files[0];t.value='';const msg=m=>{const el=document.getElementById('impMsg');if(el)el.textContent=m};
    if(!/\.pptx$/i.test(f.name)){msg(/\.(ppt|key|show|hwp)$/i.test(f.name)?'이 형식은 바로 못 읽어요. 발표 프로그램에서 .pptx나 PDF로 저장해서 올려 주세요.':'.pptx 파일만 읽을 수 있어요.');return}
    msg('파워포인트 읽는 중…');
    try{const sl=await readPptx(await f.arrayBuffer());if(!sl.length)throw new Error('empty');let added=0,notes=0;
      sl.forEach((p,i)=>{let s=T.slides[i];if(!s){s=newSlide();T.slides.push(s);added++}if(!s.title&&p.title)s.title=p.title;if(!s.kw&&p.body.length)s.kw=p.body.slice(0,5).join(' · ').slice(0,140);if(!s.script&&p.notes){s.script=p.notes;notes++}s.src=p.body.join('\n')});
      distribute(T);save();R.msg=`✓ 슬라이드 ${sl.length}장을 읽었어요${added?` (새로 ${added}장)`:''}${notes?` · 발표자 노트 ${notes}개를 대본으로 넣었어요`:''}. 키워드는 슬라이드 글자에서 가져왔으니 다듬어 주세요.`;render()}
    catch(err){const m=String(err&&err.message||err);msg(m==='nodecomp'?'이 브라우저에서는 파워포인트를 열 수 없어요. 최신 사파리나 크롬에서 해 보거나 PDF로 올려 주세요.':m==='zip'?'파일이 손상됐거나 .pptx 형식이 아니에요.':'파워포인트를 읽지 못했어요.')}return}
  if(t.id==='impF'&&t.files[0]){const f=t.files[0];t.value='';try{const j=JSON.parse(await f.text());if(j.app!=='rehearsal'||!j.state)throw 0;if(!confirm('지금 내용을 백업 파일 내용으로 바꿀까요?'))return;
    try{for(const k of await idb.keys())await idb.del(k)}catch(_){}for(const k in IC)delete IC[k];
    for(const [k,v] of Object.entries(j.kv||{})){if(k[0]==='r'){const b=await (await fetch(v.b64)).arrayBuffer();await idb.put(k,{type:v.type,buf:b})}else await idb.put(k,v)}
    state=Object.assign(fresh(),j.state);save();toast('불러왔어요');go('home')}catch(err){toast('올바른 백업 파일이 아니에요')}}
});
main.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ckIn'){e.preventDefault();ACT.addCk()}});
render();
</script>
