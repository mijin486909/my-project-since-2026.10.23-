<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="되새김">
<title>되새김 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{
  --paper:#f4f2ec; --paper2:#fbfaf6; --ink:#2f3437; --ink2:#787d83; --line:#e2dfd6; --dash:#cfcabd;
  --accent:#2f6f73; --accentS:#e3eeee; --red:#c8553d; --ok:#4f8a5b; --mid:#d39a2c;
  --hand:'Gaegu',cursive; --body:'Gowun Dodum',system-ui,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);
  background-image:linear-gradient(rgba(110,140,160,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(110,140,160,.09) 1px,transparent 1px);
  background-size:22px 22px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:10px 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.logo{font-family:var(--hand);font-weight:700;font-size:28px}
.logo i{font-style:normal;color:var(--accent)}
.icon{border:0;background:none;width:44px;height:44px;border-radius:50%;font-size:24px;display:grid;place-items:center}
.card{background:var(--paper2);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
h2.vt{font-family:var(--hand);font-size:30px;margin:6px 0 0}
h3{font-family:var(--hand);font-size:23px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h4{font-size:13px;color:var(--ink2);margin:14px 0 6px;font-weight:400;letter-spacing:.5px}
.cnt{font-family:var(--body);font-size:12px;background:var(--accent);color:#fff;border-radius:999px;padding:1px 8px}
.muted{color:var(--ink2)} .small{font-size:13px} .hint{font-size:13px;color:var(--ink2);margin:0 0 8px}
.empty{color:var(--ink2);font-size:14px;margin:4px 0}
label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 4px}
label small{opacity:.8}
.in{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);min-width:0}
.ta{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);resize:vertical;line-height:1.6;min-height:120px}
.in:focus,.ta:focus{outline:2px solid var(--accentS);border-color:var(--accent)}
.btn{border:1.5px solid var(--ink);background:#fff;border-radius:12px;padding:10px 16px;box-shadow:0 2px 0 var(--ink);font-size:15px}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.pri{background:var(--accent);border-color:#204e51;color:#fff;box-shadow:0 2px 0 #204e51}
.btn.ghost{border:1.5px dashed var(--dash);box-shadow:none;background:transparent;color:var(--ink2)}
.btn.danger{border-color:var(--red);color:var(--red);box-shadow:0 2px 0 var(--red)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.full{width:100%;margin-top:12px}
.lnk{border:0;background:none;color:var(--accent);text-decoration:underline;font-size:13px;padding:2px 4px}
.row{display:flex;gap:8px;align-items:center} .row>.btn{flex:1} .sb{justify-content:space-between}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:rgba(255,255,255,.7);border-radius:999px;padding:5px 12px;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.chip.on{border-color:var(--ink);background:#fff;box-shadow:0 2px 0 var(--ink)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center}
.seg button small{font-size:11px;color:var(--ink2)}
.seg button.on{border-color:var(--accent);background:var(--accentS);color:var(--accent);font-weight:700}
.back{margin:4px 0 -4px}
/* 오늘 */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:4px}
.dt{font-family:var(--hand);font-size:30px;font-weight:700;line-height:1.1}
.dday{flex:none;text-align:center;border:2px solid var(--red);color:var(--red);border-radius:12px;padding:3px 10px;font-size:12px;line-height:1.2;transform:rotate(3deg)}
.dday b{font-family:var(--hand);font-size:24px}
.stp{display:block;width:100%;text-align:left;border:1.5px dashed var(--dash);background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:14px}
.plan{list-style:none;padding:0;margin:0;counter-reset:p}
.plan li{counter-increment:p;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.plan li:last-child{border:0}
.plan li:before{content:counter(p);font-family:var(--hand);font-size:22px;font-weight:700;color:var(--accent);text-align:center}
.plan b{display:block;font-weight:400}
.plan small{color:var(--ink2);font-size:12px;display:block}
.plan .m{font-size:12px;color:var(--ink2);text-align:right}
.total{font-size:13px;color:var(--ink2);text-align:right;margin-top:6px}
.task,.lesson,.wr{display:grid;grid-template-columns:4px 1fr;column-gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.task:last-child,.lesson:last-child,.wr:last-child{border:0}
.task .bar,.lesson .bar,.wr .bar{grid-row:1/3;border-radius:2px}
.tx b{font-weight:400;display:block}
.tx small{font-size:12px;color:var(--ink2);display:block}
.tx em{font-style:normal;color:var(--red)}
.rate{grid-column:2;display:flex;gap:6px;margin-top:7px}
.rate button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 0;font-size:13px}
.rate button[data-rate="1"]{color:var(--red)} .rate button[data-rate="2"]{color:var(--mid)} .rate button[data-rate="3"]{color:var(--ok)}
.rate button:active{background:var(--accentS)}
.rated{grid-column:2;font-size:12px;color:var(--ink2);margin-top:4px}
.task.dn .tx b{text-decoration:line-through;color:var(--ink2)}
.lesson .row{grid-column:2;margin-top:6px}
details summary{cursor:pointer;font-size:13px;color:var(--ink2);padding:8px 0 2px}
/* 달력 */
.calh{display:flex;align-items:center;justify-content:space-between}
.calh b{font-family:var(--hand);font-size:28px}
.wk,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk span{text-align:center;font-size:12px;color:var(--ink2)}
.cal>i{display:block}
.cd{border:1.5px solid var(--line);background:#fff;border-radius:9px;min-height:52px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.cd b{font-weight:400;font-size:13px}
.cd.we{background:transparent;border-style:dashed}
.cd.off{background:#ece9e1;color:var(--ink2)}
.cd.ew{background:#fbe9e3}
.cd.exam{background:var(--red);color:#fff;border-color:var(--red)}
.cd.today{border-color:var(--ink);border-width:2px}
.cd.sel{box-shadow:0 0 0 2px var(--accent)}
.cd em{font-style:normal;font-size:11px}
.cd .n{font-size:11px;background:var(--accentS);color:var(--accent);border-radius:6px;padding:0 4px}
.cd .n.all{background:var(--ok);color:#fff}
.cd .n.late{background:#f6dcd4;color:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.flag{background:#fbe9e3;color:var(--red);border-radius:8px;padding:6px 10px;font-size:13px;margin:6px 0}
/* 백지 */
.stats{display:flex;gap:8px;margin:10px 0}
.stats div{flex:1;background:var(--paper2);border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stats b{display:block;font-family:var(--hand);font-size:26px;line-height:1.1}
.stats small{font-size:11px;color:var(--ink2)}
.unit{font-size:13px;color:var(--ink2);margin:12px 0 4px}
.kc{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;margin-bottom:6px;text-align:left}
.sc{flex:none;font-size:12px;border-radius:999px;padding:1px 9px;background:#eee;color:var(--ink2)}
.sc.g{background:#e2efe4;color:var(--ok)} .sc.m{background:#f8ecd2;color:#a37314} .sc.b{background:#f6dcd4;color:var(--red)}
.kwbig{font-family:var(--hand);font-size:34px;font-weight:700;text-align:center;line-height:1.2;margin:10px 0 2px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:var(--accent)}
.tb{display:flex;gap:4px;overflow-x:auto;margin:6px 0;scrollbar-width:none}
.tb::-webkit-scrollbar{display:none}
.tb button{flex:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font-size:13px}
.prev{background:#fff;border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;min-height:40px;font-size:14px;overflow-x:auto}
.prev:empty:before{content:'수식 미리보기';color:var(--dash)}
.score{text-align:center;margin:8px 0}
.score b{font-family:var(--hand);font-size:56px;line-height:1}
.score small{display:block;color:var(--ink2);font-size:13px}
.pt{display:flex;gap:8px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:14px;align-items:flex-start;overflow-x:auto}
.pt .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;margin-top:1px}
.pt.s2 .ic{background:var(--ok)} .pt.s1 .ic{background:var(--mid)} .pt.s0 .ic{background:var(--red)}
.pt.s0{border-color:#ecc3b8;background:#fdf4f1}
.pt.na{color:var(--ink2);border-style:dashed;display:block}
mark{background:#f6cfc4;color:inherit;border-radius:3px;padding:0 1px}
mark.h{background:#f6e3b8}
.mm{border-bottom:2px solid var(--red)}
.mine{background:#fff;border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px;font-size:14px;overflow-x:auto}
.body{font-size:14px}
.body div{margin:3px 0;overflow-x:auto}
.miss{background:#fdf4f1;border:1.5px solid #ecc3b8;border-radius:12px;padding:10px 12px;font-size:14px}
.miss li{margin:3px 0}
.res{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
/* 오답 */
.wr{grid-template-columns:4px 56px 1fr;cursor:pointer}
.wr .bar{grid-row:1}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#eee;display:grid;place-items:center;color:var(--ink2);font-size:11px;border:1px solid var(--line)}
.wr .tx{align-self:center}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-right:4px;color:var(--ink2);background:#fff}
.photo{width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin:6px 0}
.rbar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0}
.rbar i{display:block}
.rleg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--ink2)}
.rleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px}
.hist{display:flex;gap:4px;margin:6px 0}
.hist i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#fff;font-style:normal}
/* 약점 */
.diag{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.diag:first-of-type{border:0;margin:0;padding:0}
.dh{display:flex;align-items:center;gap:8px;font-weight:700}
.dh i{width:10px;height:10px;border-radius:50%}
.nums{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2);margin:4px 0}
.adv{margin:4px 0 0;padding-left:18px;font-size:14px}
.adv li{margin:3px 0}
.weak{padding:9px 0;border-bottom:1px dashed var(--line)}
.weak:last-child{border:0}
.weak .t{display:flex;justify-content:space-between;gap:8px}
.weak small{display:block;font-size:12px;color:var(--ink2)}
.wp{font-size:13px;background:#fdf4f1;border-radius:6px;padding:4px 8px;margin-top:4px;overflow-x:auto}
.day{border-left:3px solid var(--red);padding:4px 0 4px 10px;margin:8px 0}
.day b{font-family:var(--hand);font-size:20px}
.day div{font-size:13px}
.tips{font-size:14px;padding-left:18px;margin:0}
.tips li{margin:4px 0}
/* 설정 */
.addb{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin:4px 0 10px}
.tt{display:grid;gap:3px;margin:8px 0;user-select:none;-webkit-user-select:none}
.tt span{font-size:12px;color:var(--ink2);text-align:center;align-self:center}
.tc{border:1.5px dashed var(--dash);background:#fff;border-radius:8px;min-height:44px;padding:2px;font-size:11px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.tc.f{border-style:solid;border-color:transparent}
.tc b{font-size:12px} .tc small{font-size:10px;opacity:.8}
.srow{display:grid;grid-template-columns:38px 1fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
.srow input[type=color]{width:38px;height:38px;border:1.5px solid var(--line);border-radius:9px;padding:2px;background:#fff}
.srow label{margin:0;font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.help{font-size:13px;color:var(--ink2);margin-top:8px}
.help pre{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;white-space:pre-wrap;color:var(--ink);margin:4px 0 10px}
/* 공통 */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper2);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav .in2{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;padding:10px 0 13px;font-family:var(--hand);font-size:20px;color:var(--ink2);position:relative}
.nav button.on{color:var(--ink);font-weight:700}
.nav button.on:after{content:"";position:absolute;left:28%;right:28%;bottom:8px;height:3px;border-radius:2px;background:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.katex{font-size:1.05em}
.katex-display{margin:.3em 0;overflow-x:auto;overflow-y:hidden}
</style>
</head>
<body>
<div class="app">
  <header><div class="logo">되새김 <i>노트</i></div><button class="icon" id="gear" aria-label="설정">⚙︎</button></header>
  <main id="main"></main>
</div>
<nav class="nav"><div class="in2">
  <button data-v="today">오늘</button><button data-v="cal">달력</button><button data-v="recall">백지</button><button data-v="wrong">오답</button><button data-v="weak">약점</button>
</div></nav>
<div id="toast"></div>
<script>
/* ================= 기본 유틸 ================= */
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateOf=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>sod(new Date()); const TK=()=>keyOf(today());
const diffDays=(a,b)=>Math.round((dateOf(b)-dateOf(a))/864e5);
const DOW=['일','월','화','수','목','금','토'];
const md=k=>{const d=dateOf(k);return `${d.getMonth()+1}/${d.getDate()}`};
const mdw=k=>{const d=dateOf(k);return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`};
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const pct=x=>Math.round(x*100)+'%';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

/* ================= 저장 ================= */
const KEY='doesaegim-v1';
const PRESETS={light:{name:'가볍게',iv:[0,7,21]},basic:{name:'기본',iv:[0,3,7,14]},dense:{name:'촘촘하게',iv:[0,1,3,7,14,28]}};
const REASONS=['개념 부족','계산 실수','문제 잘못 읽음','시간 부족','기타'];
const RCOL={'개념 부족':'#c8553d','계산 실수':'#d39a2c','문제 잘못 읽음':'#4a6fa5','시간 부족':'#8a5a9e','기타':'#9a9a9a'};
const WIV=[1,3,7,14,30];
const DEF_SUBS=[['국어','#c8553d'],['수학','#2f6f73'],['영어','#d39a2c'],['물리','#4a6fa5'],['화학','#8a5a9e'],['생명과학','#4f8a5b'],['지구과학','#a0703c'],['정보','#5e7d8a']];
function fresh(){return {v:1,subs:DEF_SUBS.map(([name,color],i)=>({id:'s'+i,name,color,review:true})),tt:{periods:7,cells:{}},brushes:[],
  term:{start:TK(),exam:'',preset:'basic'},off:{},cancel:{},lmeta:{},done:{},cards:[],rhist:{},wrongs:[]}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.subs&&s.tt)return Object.assign(fresh(),s)}catch(e){}return fresh()}
let state=load(), warned=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){if(!warned){warned=true;toast('저장 공간이 부족해요. 설정에서 백업을 내보내 주세요.')}}}
let sT;function saveSoon(){clearTimeout(sT);sT=setTimeout(save,400)}
window.addEventListener('pagehide',save);
const subById=id=>state.subs.find(s=>s.id===id)||{id,name:'(삭제된 과목)',color:'#bbb'};
const cardById=id=>state.cards.find(c=>c.id===id);

/* 사진은 IndexedDB에 (localStorage는 용량이 작아서) */
const idb={p:null,
  open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('doesaegim-img',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},

function tex(root){

const fixNotion=t=>t.replace(/\$`([^`]+)`\$/g,(m,a)=>'$'+a+'$');
/* 본문 → 덩어리(줄 / $$수식 블록$$) */
function segments(body){
  const out=[];let buf=null;
  for(const raw of fixNotion(body||'').split('\n')){
    const l=raw.trim();
    if(buf){buf.push(l);if(l.includes('$$')){out.push({t:buf.join('\n'),math:true});buf=null}continue}
    if(!l)continue;
    if(l.startsWith('$$')){if(l.length>4&&l.endsWith('$$'))out.push({t:l,math:true});else buf=[l];continue}
    out.push({t:l.replace(/^([-*•·▪︎]|\d+[.)])\s+/,''),math:false});
  }
  if(buf)out.push({t:buf.join('\n'),math:true});
  return out;
}
function bodyHtml(body){return segments(body).map(s=>`<div>${esc(s.t)}</div>`).join('')}

/* ================= 토글 붙여넣기 해석 ================= */
function parseToggles(text){
  text=fixNotion((text||'').replace(/\r/g,''));
  const lines=text.split('\n'),res=[];let cur=null;
  const mk=/^\s{0,1}(▶|▸|►|▷|▾|▼|#{1,6})\s*(.+)$/;
  const markerMode=lines.some(l=>mk.test(l));
  const indentMode=!markerMode&&lines.some(l=>/^(\s{2,}|\t)\S/.test(l));
  const clean=k=>k.replace(/^([-*•]|\d+[.)])\s+/,'').replace(/\*\*/g,'').trim();
  if(markerMode||indentMode){
    for(const l of lines){
      let kw=null;
      if(markerMode){const m=l.match(mk);if(m)kw=m[2]}
      else if(/^\S/.test(l))kw=l;
      if(kw!==null){kw=clean(kw);if(!kw)continue;cur={kw,lines:[]};res.push(cur);continue}
      if(cur)cur.lines.push(l);
    }
  }else{
    text.split(/\n\s*\n/).forEach(b=>{const ls=b.split('\n').filter(x=>x.trim());if(ls.length>1)res.push({kw:clean(ls[0]),lines:ls.slice(1)})});
  }
  return res.map(r=>({kw:r.kw,body:dedent(r.lines)})).filter(r=>r.kw&&r.body.trim());
}
function dedent(lines){
  const L=lines.map(l=>l.replace(/\t/g,'    '));const ne=L.filter(l=>l.trim());
  if(!ne.length)return '';const min=Math.min(...ne.map(l=>l.length-l.trimStart().length));
  return L.map(l=>l.trim()?l.slice(min):'').join('\n').trim();
}

function tokensOf(text){
  const out=[],seen=new Set();const add=(t,k)=>{if(!seen.has(t)){seen.add(t);out.push({t,k})}};
  const rest=text.replace(/\$\$([\s\S]+?)\$\$|\$([^$]+)\$/g,(m,a,b)=>{const e=normMath(a||b);
    if(e.length<=24){if(e.length>=2)add(e,'m')}else e.split(/=|\\le|\\ge|\\leq|\\geq|<|>|\\approx/).map(x=>x.trim()).filter(x=>x.length>=2).forEach(x=>add(x,'m'));return ' '});
  rest.split(/[^0-9A-Za-z가-힣]+/).forEach(w=>{

}

function hit(tok,A){

function splitSentences(t){
  const m=[];const s=t.replace(/\$[^$]+\$/g,x=>{m.push(x);return '\u0001'+(m.length-1)+'\u0001'});

function pointsOf(body){const out=[];segments(body).forEach(s=>{if(s.math)out.push({t:s.t,math:true});else splitSentences(s.t).forEach(t=>out.push({t,math:false}))});return out}

    let sum=0;toks.forEach(k=>{k.h=hit(k,A);sum+=k.h});const cov=sum/toks.length;return {...p,toks,cov,s:cov>=.7?2:cov>=.35?1:0}});
}
const scoreOf=pts=>{const g=pts.filter(p=>p.s!==null);return g.length?mean(g.map(p=>p.s/2)):0};
function highlight(p){

    if(i%2){const e=normMath(part.slice(1,-1));const miss=p.toks.some(k=>k.k==='m'&&k.h<1&&e.includes(k.t));return miss?`<span class="mm">${esc(part)}</span>`:esc(part)}

function rate(tid,r){
  const T=TK();state.done[tid]={r:+r,at:T};
  if(+r<3){const L=tid.split('@')[0],m=state.lmeta[L]=state.lmeta[L]||{};m.extra=(m.extra||[]).concat([{d:keyOf(addDays(today(),+r===1?1:2)),from:tid}])}
  save();render();
}
function undo(tid){delete state.done[tid];const L=tid.split('@')[0],m=state.lmeta[L];if(m&&m.extra)m.extra=m.extra.filter(e=>e.from!==tid);save();render()}
function insertAt(id,i){
  const ta=document.getElementById(id);if(!ta)return;const[,a,b]=TB[i],s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;
  ta.value=v.slice(0,s)+a+v.slice(s,e)+b+v.slice(e);ta.focus();const pos=s+a.length+(e-s);ta.setSelectionRange(pos,pos);ta.dispatchEvent(new Event('input',{bubbles:true}));
}
function startSess(){
  const sc=document.getElementById('rsScope').value,ord=document.getElementById('rsOrder').value,n=+document.getElementById('rsN').value;
  let cs=state.cards.filter(c=>rFilter==='all'||c.sub===rFilter);
  if(sc.startsWith('u:')){const[sid,u]=sc.slice(2).split('¦');cs=cs.filter(c=>c.sub===sid&&(c.unit||'단원 없음')===u)}
  if(ord==='rand')cs=cs.map(c=>[Math.random(),c]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  else if(ord==='weak')cs=cs.map(c=>{const s=cstat(c);return [s.n?s.recent:.6,c]}).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  startSession(cs.slice(0,n).map(c=>c.id));
}
function finishCard(){
  const c=cardById(sess.ids[sess.i]),sc=scoreOf(sess.g);
  const h=state.rhist[c.id]=state.rhist[c.id]||[];
  h.push({at:TK(),score:sc,pts:sess.g.filter(p=>p.s!==null).map(p=>({t:p.t.slice(0,200),s:p.s}))});
  if(h.length>12)h.splice(0,h.length-12);
  sess.res.push({id:c.id,score:sc});sess.i++;sess.phase='write';sess.ans='';sess.g=null;save();render();
}

function importAll(f){
  if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.state||!d.state.subs)throw 0;
    if(!confirm('지금 기록을 백업 파일 내용으로 바꿀까요?'))return;
    state=Object.assign(fresh(),d.state);for(const[k,v]of Object.entries(d.imgs||{})){await idb.put(k,v);imgCache[k]=v}
    save();toast('불러왔어요');render()}catch(e){toast('올바른 백업 파일이 아니에요')}};
  r.readAsText(f);
}
function makeSample(){
  const s=fresh(),T=today(),sid=n=>s.subs.find(x=>x.name===n).id;
  s.brushes=[['국어','이쌤'],['수학','김쌤'],['수학','박쌤'],['영어','최쌤'],['물리','정쌤'],['화학','한쌤'],['생명과학','윤쌤'],['정보','강쌤']].map(([n,t])=>({sub:sid(n),teacher:t}));
  const pat=[[1,4,0,5,3,6,7],[2,0,4,6,1,3,5],[0,1,5,3,4,2,6],[4,2,0,7,5,1,3],[1,5,3,0,6,4,2]];
  pat.forEach((row,d)=>row.forEach((b,p)=>{const x=s.brushes[b];s.tt.cells[(d+1)+'-'+(p+1)]={sub:x.sub,teacher:x.teacher}}));
  s.subs.find(x=>x.name==='국어').review=false;
  s.term={start:keyOf(addDays(T,-24)),exam:keyOf(addDays(T,38)),preset:'basic'};
  state=s;const D=build(),TK0=TK();
  D.lessons.filter(l=>l.date<TK0).forEach((l,i)=>{if(i%3===0)(state.lmeta[l.key]=state.lmeta[l.key]||{}).memo=['도입','개념 정리','예제 풀이','심화 문제'][i%4]});
  D.tasks.filter(t=>t.date<TK0).forEach((t,i)=>{if(i%31===4)return;const r=i%7===0?1:i%5===0?2:3;state.done[t.id]={r,at:t.date}});
  const C=[['물리','운동량과 충격량','운동량','질량과 속도의 곱으로, 방향을 가진 벡터량이다.\n$\\vec{p}=m\\vec{v}$\n단위는 $\\mathrm{kg\\cdot m/s}$이다.'],
    ['물리','운동량과 충격량','충격량','물체가 받은 힘과 힘이 작용한 시간의 곱이다.\n$\\vec{I}=\\vec{F}\\Delta t$\n충격량은 운동량의 변화량과 같다.\n$$\\vec{I}=\\Delta\\vec{p}$$'],
    ['물리','운동량과 충격량','운동량 보존 법칙','외력이 작용하지 않으면 충돌 전후 운동량의 총합은 일정하다.\n$m_1v_1+m_2v_2=m_1v_1\'+m_2v_2\'$\n충돌의 종류와 관계없이 성립한다.'],
    ['수학','이차방정식','판별식','이차방정식 $ax^2+bx+c=0$에서 판별식은 $D=b^2-4ac$이다.\n$D>0$이면 서로 다른 두 실근을 가진다.\n$D=0$이면 중근을 가진다.\n$D<0$이면 서로 다른 두 허근을 가진다.'],
    ['수학','이차방정식','근과 계수의 관계','두 근을 $\\alpha,\\beta$라 하면 $\\alpha+\\beta=-\\frac{b}{a}$이다.\n$\\alpha\\beta=\\frac{c}{a}$이다.'],
    ['화학','화학 결합','이온 결합','금속 양이온과 비금속 음이온 사이의 정전기적 인력에 의한 결합이다.\n고체 상태에서는 전기 전도성이 없고 액체나 수용액 상태에서 전기 전도성이 있다.'],
    ['화학','화학 결합','공유 결합','비금속 원자들이 전자쌍을 공유하여 형성하는 결합이다.\n전자쌍 1개를 공유하면 단일 결합, 2개를 공유하면 이중 결합이다.']];
  state.cards=C.map(([n,u,k,b])=>({id:uid(),sub:sid(n),unit:u,kw:k,body:b,created:TK0}));
  const fake=[['충격량',[.5,.6]],['판별식',[.9]],['이온 결합',[.4,.55,.5]],['근과 계수의 관계',[.75]]];
  fake.forEach(([kw,sc])=>{const c=state.cards.find(x=>x.kw===kw);state.rhist[c.id]=sc.map((v,i)=>{const pts=pointsOf(c.body).map((p,j)=>({t:p.t.slice(0,200),s:j===(i%2)+1&&v<.8?0:v<.6&&j===0?1:2}));return {at:keyOf(addDays(T,-6+i*2)),score:v,pts}})});
  const W=[['수학','계산 실수','$x^2-6x+k=0$이 중근을 가질 때 $k$의 값','$D=36-4k=0$ 이므로 $k=9$',2],['물리','개념 부족','공이 벽에 수직으로 부딪혀 같은 속력으로 튕겨 나올 때 운동량 변화량','방향이 바뀌므로 $\\Delta p=2mv$',0],['물리','개념 부족','두 물체 완전 비탄성 충돌 후 속도','$m_1v_1=(m_1+m_2)v$',1],['화학','문제 잘못 읽음','고체 상태에서 전기 전도성이 있는 물질 고르기','금속 결합 물질만 해당',3]];
  state.wrongs=W.map(([n,r,m,sol,st],i)=>({id:uid(),sub:sid(n),lesson:'',img:'',memo:m,sol,reason:r,created:keyOf(addDays(T,-10+i)),stage:st,next:i<2?TK0:keyOf(addDays(T,i)),done:false,hist:Array.from({length:st},()=>({d:TK0,ok:true}))}));
  save();
}

main.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-wr],[data-card]');if(!t)return;const d=t.dataset;
  if(d.go){const g=d.go;if(g==='tt'||g==='term'){go('settings');setTimeout(()=>{const el=document.getElementById(g==='tt'?'sec-tt':'sec-term');el&&el.scrollIntoView({behavior:'smooth'})},50)}else if(g==='tasks'){const el=document.getElementById('tasks');el&&el.scrollIntoView({behavior:'smooth'})}else go(g);return}
  if(d.rate)return rate(d.tid,d.rate);
  if(d.undo)return undo(d.undo);
  if(d.cancel){state.cancel[d.cancel]?delete state.cancel[d.cancel]:state.cancel[d.cancel]=1;save();return go(view,{keep:1})}
  if(d.off){state.off[d.off]?delete state.off[d.off]:state.off[d.off]=1;save();return go(view,{keep:1})}
  if(d.cal){calSel=d.cal;return go('cal',{keep:1})}
  if(d.rf){rFilter=d.rf;return go('recall',{keep:1})}
  if(d.card){editCard=d.card;return go('card')}
  if(d.tb!==undefined)return insertAt(d.for,+d.tb);
  if(d.pt!==undefined){const p=sess.g[+d.pt];p.s=p.s===2?1:p.s===1?0:2;return go('session',{keep:1})}
  if(d.wr){wDetail=d.wr;return go('wdetail')}
  if(d.ws){wSub=d.ws;return go('wrong',{keep:1})}
  if(d.wt){wTab=d.wt;return go('wrong',{keep:1})}
  if(d.reason){wEdit.reason=d.reason;document.querySelectorAll('[data-reason]').forEach(b=>b.classList.toggle('on',b===t));return}
  if(d.preset){state.term.preset=d.preset;save();return go('settings',{keep:1})}
  if(d.brush!==undefined){selBrush=d.brush==='erase'?'erase':+d.brush;return go('settings',{keep:1})}
  if(d.cell){if(selBrush===null){toast('먼저 위에서 과목·선생님 버튼을 골라 주세요');return}
    if(selBrush==='erase')delete state.tt.cells[d.cell];else{const b=state.brushes[selBrush];state.tt.cells[d.cell]={sub:b.sub,teacher:b.teacher}}save();return go('settings',{keep:1})}
  if(d.sdel){const s=subById(d.sdel);if(!confirm(`'${s.name}' 과목을 삭제할까요? 시간표 칸과 키워드, 오답도 같이 지워져요.`))return;
    state.subs=state.subs.filter(x=>x.id!==d.sdel);for(const k in state.tt.cells)if(state.tt.cells[k].sub===d.sdel)delete state.tt.cells[k];
    state.brushes=state.brushes.filter(b=>b.sub!==d.sdel);selBrush=null;state.cards=state.cards.filter(c=>c.sub!==d.sdel);state.wrongs=state.wrongs.filter(w=>w.sub!==d.sdel);save();return go('settings',{keep:1})}
  const A=ACT[d.act];if(A)A(t,d);
});
const ACT={
  mon(t,d){calM=new Date(calM.getFullYear(),calM.getMonth()+(+d.d),1);go('cal',{keep:1})},
  ics:exportICS,
  imSave(){const r=parseToggles(document.getElementById('imText').value);if(!r.length){toast('저장할 키워드가 없어요');return}
    const sub=document.getElementById('imSub').value,unit=document.getElementById('imUnit').value.trim();
    r.forEach(x=>state.cards.push({id:uid(),sub,unit,kw:x.kw,body:x.body,created:TK()}));save();rFilter=sub;toast(`키워드 ${r.length}개를 저장했어요`);go('recall')},
  ceSave(){const c=cardById(editCard);c.kw=document.getElementById('ceKw').value.trim()||c.kw;c.sub=document.getElementById('ceSub').value;c.unit=document.getElementById('ceUnit').value.trim();c.body=document.getElementById('ceBody').value;save();toast('저장했어요');go('card',{keep:1})},
  ceDel(){if(!confirm('이 키워드를 삭제할까요?'))return;state.cards=state.cards.filter(c=>c.id!==editCard);delete state.rhist[editCard];save();go('recall')},
  startSess, startIds(t,d){startSession(d.ids.split(','))},
  quitSess(){if(sess&&sess.res.length){sess.i=sess.ids.length;go('session')}else{sess=null;go('recall')}},
  gradeIt(){sess.ans=document.getElementById('ans').value;sess.g=grade(cardById(sess.ids[sess.i]).body,sess.ans);sess.phase='graded';go('session')},
  giveUp(){sess.ans='';sess.g=grade(cardById(sess.ids[sess.i]).body,'');sess.phase='graded';go('session')},
  nextCard:finishCard,
  wNew(){wEdit={id:null,sub:wSub!=='all'?wSub:state.subs[0]&&state.subs[0].id,lesson:'',memo:'',sol:'',reason:'개념 부족',imgData:null,img:''};go('wedit')},
  weNoImg(){wEdit.imgData=null;wEdit.dropImg=true;go('wedit',{keep:1})},
  async weSave(){const w=wEdit;w.sub=document.getElementById('weSub').value;w.lesson=document.getElementById('weLes').value;w.memo=document.getElementById('weMemo').value.trim();w.sol=document.getElementById('weSol').value.trim();
    if(!w.memo&&!w.imgData){toast('사진이나 문제 메모 중 하나는 넣어 주세요');return}
    let img=w.img;if(w.dropImg&&img){idb.del(img).catch(()=>{});delete imgCache[img];img=''}
    if(w.imgData&&w.imgData!==imgCache[w.img]){img=img||'img'+uid();try{await idb.put(img,w.imgData);imgCache[img]=w.imgData}catch(e){toast('사진을 저장하지 못했어요');img=''}}
    const rec={sub:w.sub,lesson:w.lesson,memo:w.memo,sol:w.sol,reason:w.reason,img};
    if(w.id)Object.assign(state.wrongs.find(x=>x.id===w.id),rec);
    else state.wrongs.push({id:uid(),...rec,created:TK(),stage:0,next:keyOf(addDays(today(),WIV[0])),done:false,hist:[]});
    save();toast('저장했어요. 내일 다시 풀 차례로 넣었어요');wTab=w.id?wTab:'active';go(w.id?'wdetail':'wrong')},
  wRes(t,d){const w=state.wrongs.find(x=>x.id===wDetail),ok=d.ok==='1',T=TK();w.hist=(w.hist||[]).concat([{d:T,ok}]);
    if(ok){w.stage++;if(w.stage>=WIV.length){w.done=true;toast('완료! 이 문제는 이제 안 나와요')}else{w.next=keyOf(addDays(today(),WIV[w.stage]));toast(`${WIV[w.stage]}일 뒤에 다시 나와요`)}}
    else{w.stage=0;w.next=keyOf(addDays(today(),1));toast('내일 다시 나와요')}save();go('wdetail',{keep:1})},
  async wEditIt(){const w=state.wrongs.find(x=>x.id===wDetail);wEdit={...w,imgData:w.img?await getImg(w.img):null};wDetail=w.id;go('wedit')},
  wDel(){if(!confirm('이 오답을 삭제할까요?'))return;const w=state.wrongs.find(x=>x.id===wDetail);if(w.img)idb.del(w.img).catch(()=>{});state.wrongs=state.wrongs.filter(x=>x.id!==wDetail);save();go('wrong')},
  addBrush(){const sub=document.getElementById('bSub').value,teacher=document.getElementById('bT').value.trim();
    if(state.brushes.some(b=>b.sub===sub&&b.teacher===teacher)){toast('이미 있는 버튼이에요');return}
    state.brushes.push({sub,teacher});selBrush=state.brushes.length-1;save();go('settings',{keep:1})},
  delBrush(){if(typeof selBrush!=='number')return;state.brushes.splice(selBrush,1);selBrush=null;save();go('settings',{keep:1})},
  per(t,d){state.tt.periods=Math.max(4,Math.min(10,state.tt.periods+(+d.d)));save();go('settings',{keep:1})},
  addSub(){const used=state.subs.map(s=>s.color),pal=['#b5654a','#3f7f6e','#7b6aa8','#c08a2e','#5b7fa6','#a0526e'];state.subs.push({id:'s'+uid(),name:'새 과목',color:pal.find(c=>!used.includes(c))||'#888',review:true});save();go('settings',{keep:1})},
  export:exportAll, import(){document.getElementById('impF').click()},
  sample(){if(!confirm('지금 기록을 지우고 샘플 데이터로 바꿀까요?'))return;makeSample();toast('샘플 데이터를 넣었어요');go('today')},
  wipe(){if(!confirm('모든 기록을 지울까요? 되돌릴 수 없어요.'))return;state=fresh();save();toast('모두 지웠어요');go('today')}
};
let pvT;
main.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.memo!==undefined){const m=state.lmeta[d.memo]=state.lmeta[d.memo]||{};m.memo=t.value;saveSoon();return}
  if(t.id==='imText'){clearTimeout(pvT);pvT=setTimeout(imPreview,300);return}
  const pv={ans:'ansPrev',ceBody:'cePrev',weMemo:'weMemoPrev',weSol:'weSolPrev'}[t.id];
  if(pv){if(t.id==='ans')sess.ans=t.value;if(wEdit&&t.id==='weMemo')wEdit.memo=t.value;if(wEdit&&t.id==='weSol')wEdit.sol=t.value;
    clearTimeout(pvT);pvT=setTimeout(()=>{const el=document.getElementById(pv);if(el){el.innerHTML=bodyHtml(t.value);tex(el.parentNode)}},300)}
});
main.addEventListener('change',async e=>{
  const t=e.target,d=t.dataset;
  if(d.set){state.term[d.set]=t.value;if(d.set==='start'&&!t.value)state.term.start=TK();save();return go('settings',{keep:1})}
  if(d.scol){subById(d.scol).color=t.value;save();return}
  if(d.sname){const v=t.value.trim();if(v){subById(d.sname).name=v;save()}else t.value=subById(d.sname).name;return}
  if(d.srev){subById(d.srev).review=t.checked;save();return}
  if(t.id==='impF'){importAll(t.files[0]);t.value='';return}
  if(t.id==='weSub'){wEdit.sub=t.value;wEdit.lesson='';wEdit.memo=document.getElementById('weMemo').value;wEdit.sol=document.getElementById('weSol').value;return go('wedit',{keep:1})}
  if(t.id==='weFile'&&t.files[0]){try{wEdit.imgData=await compress(t.files[0]);wEdit.dropImg=false;wEdit.memo=document.getElementById('weMemo').value;wEdit.sol=document.getElementById('weSol').value;go('wedit',{keep:1})}catch(err){toast('사진을 읽지 못했어요')}}
});
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)});
document.getElementById('gear').addEventListener('click',()=>go('settings'));
render();
