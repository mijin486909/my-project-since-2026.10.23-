<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f6f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="결 노트">
<title>결 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#28343a;--ink2:#728087;--line:#dfe7e5;--accent:#2f8c8f;--accS:#e2f1f0;--coral:#e0765f;--warn:#d9822b;--warnS:#fdf0e1;--bad:#cc5644;--badS:#fbe7e3;--good:#3f8f5e;--goodS:#e5f3ea;
  --title:'Jua',sans-serif;--body:'Gowun Dodum',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(rgba(47,140,143,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(47,140,143,.06) 1px,transparent 1px);background-size:28px 28px;
  color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:540px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.logo{font-family:var(--title);font-size:26px}
.logo i{font-style:normal;color:var(--accent)}
.icon{border:0;background:none;width:44px;height:44px;border-radius:50%;font-size:22px}
h2{font-family:var(--title);font-weight:400;font-size:28px;margin:6px 0 2px}
h3{font-family:var(--title);font-weight:400;font-size:20px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h4{font-size:13px;color:var(--ink2);margin:14px 0 6px;font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.muted{color:var(--ink2)} .small{font-size:13px} .hint{font-size:13px;color:var(--ink2);margin:0 0 8px}
label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 4px}
.in{font:inherit;width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink)}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:42px;display:block}
.btn{border:0;background:var(--accS);color:var(--accent);border-radius:12px;padding:11px 16px;font-size:15px;font-weight:700}
.btn.pri{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border:1.5px dashed var(--line);color:var(--ink2);font-weight:400}
.btn.danger{background:var(--badS);color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.full{width:100%;margin-top:10px}
.lnk{border:0;background:none;color:var(--accent);text-decoration:underline;font-size:13px;padding:2px 4px}
.row{display:flex;gap:8px;align-items:center} .row>.btn{flex:1} .sb{justify-content:space-between}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px}
.seg button{flex:1;border-radius:10px;padding:8px 6px}
.seg button.on,.chip.on{border-color:var(--accent);background:var(--accS);color:var(--accent);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;background:var(--accS);color:var(--accent);margin-right:4px}
.tag.w{background:var(--warnS);color:var(--warn)} .tag.b{background:var(--badS);color:var(--bad)} .tag.g{background:var(--goodS);color:var(--good)}
.subtabs{display:flex;gap:6px;margin:10px 0 2px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px}
.subtabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
/* 체크 */
.ck{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:9px 2px;border-bottom:1px dashed var(--line)}
.ck:last-child{border:0}
.ck .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:15px;color:#fff}
.ck.on .bx{background:var(--accent);border-color:var(--accent)}
.ck.on .tx b{text-decoration:line-through;color:var(--ink2)}
.ck .tx b{font-weight:400;display:block}
.ck .tx small{display:block;font-size:12px;color:var(--ink2)}
.ck.virt .bx{border-color:var(--coral)}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 6px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.rt{display:flex;gap:6px}
.rt button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--ink2)}
.rt button b{font-size:22px;font-weight:400}
.rt button.on{border-color:var(--accent);background:var(--accS);color:var(--ink)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;text-align:left}
.tog i{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:.2s}
.tog i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tog.on i{background:var(--accent)} .tog.on i:after{left:21px}
.banner{border-radius:14px;padding:11px 14px;margin:10px 0;font-size:14px}
.banner.w{background:var(--warnS)} .banner.b{background:var(--badS)} .banner.a{background:var(--accS)}
/* 검사 */
.res{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.res:last-child{border:0}
.res .ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:#fff;margin-top:1px}
.res.w .ic{background:var(--warn)} .res.b .ic{background:var(--bad)} .res.g .ic{background:var(--good)} .res.t .ic{background:var(--accent)}
.res b{display:block}
.res small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.score{display:flex;gap:8px;margin:8px 0}
.score div{flex:1;border-radius:12px;padding:8px;text-align:center}
.score b{display:block;font-family:var(--title);font-size:26px;font-weight:400;line-height:1.1}
.score small{font-size:12px}
/* 루틴 편집 */
.step{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.step .mv{display:flex;flex-direction:column;gap:2px}
.step .mv button{border:1px solid var(--line);background:#fff;border-radius:6px;width:30px;height:24px;padding:0;font-size:12px;line-height:1}
.step .num{font-family:var(--title);color:var(--accent);font-size:18px}
.dw{display:flex;gap:3px;margin-top:6px}
.dw button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 0;font-size:11px;color:var(--ink2)}
.dw button.on{background:var(--accS);border-color:var(--accent);color:var(--accent)}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:14px}
.flow span{background:var(--accS);color:var(--ink);border-radius:8px;padding:3px 9px}
.flow em{font-style:normal;color:var(--ink2)}
.flow span.add{background:var(--goodS);color:var(--good);border:1px dashed var(--good)}
/* 제품 */
.prod{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px dashed var(--line);background:none;padding:10px 0}
.prod .em{width:40px;height:40px;border-radius:12px;background:var(--accS);display:grid;place-items:center;font-size:20px}
.prod b{font-weight:400;display:block}
.prod small{display:block;font-size:12px;color:var(--ink2)}
.hist{border-left:2px solid var(--line);margin:6px 0 0 8px;padding-left:14px}
.hist div{position:relative;padding:4px 0;font-size:14px}
.hist div:before{content:"";position:absolute;left:-20px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.hist div.cur:before{background:var(--accent)}
.hist small{color:var(--ink2);font-size:12px}
/* 테스트 */
.q{margin:14px 0}
.q b{display:block;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:14px}
.opts button.on{border-color:var(--accent);background:var(--accS)}
.typebig{font-family:var(--title);font-size:34px;text-align:center;color:var(--accent);line-height:1.2}
/* 가이드 */
.gs{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.gs:last-child{border:0}
.gs .n{width:34px;height:34px;border-radius:50%;background:var(--accS);color:var(--accent);display:grid;place-items:center;font-family:var(--title);font-size:17px}
.gs b{display:block}
.gs small{display:block;font-size:13px;color:var(--ink2)}
.gs .me{display:inline-block;margin-top:4px;font-size:12px;border-radius:8px;padding:2px 8px;background:var(--warnS);color:var(--warn)}
.gs .me.ok{background:var(--goodS);color:var(--good)}
.rec{padding:10px 0;border-bottom:1px dashed var(--line)}
.rec:last-child{border:0}
.rec b{display:block}
.rec small{display:block;font-size:13px;color:var(--ink2)}
.rec .how{font-size:13px;background:var(--bg);border-radius:8px;padding:6px 9px;margin-top:5px}
.chart{width:100%;height:auto;display:block}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav .in2{max-width:540px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;padding:9px 0 12px;font-size:13px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button span{font-size:20px;filter:grayscale(1);opacity:.6}
.nav button.on{color:var(--accent);font-weight:700}
.nav button.on span{filter:none;opacity:1}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="app">
  <header><div class="logo">결 <i>노트</i></div><button class="icon" data-nav="set" aria-label="설정">⚙︎</button></header>
  <main id="main"></main>
</div>
<nav class="nav"><div class="in2">
  <button data-nav="today"><span>✅</span>오늘</button><button data-nav="skin"><span>🧴</span>피부</button><button data-nav="hair"><span>💇</span>머리</button><button data-nav="prod"><span>🧺</span>제품</button>
</div></nav>
<div id="toast"></div>
<script>
/* ============ 유틸 ============ */
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateOf=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const TK=()=>keyOf(today());
const diffDays=(a,b)=>Math.round((dateOf(b)-dateOf(a))/864e5);
const DOW=['일','월','화','수','목','금','토'];
const md=k=>{const d=dateOf(k);return `${d.getMonth()+1}/${d.getDate()}`};
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
function toast(m,ms){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms||2600)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
const addMonths=(k,m)=>{const d=dateOf(k);d.setMonth(d.getMonth()+m);return keyOf(d)};

/* ============ 기준 데이터 ============ */
// key: [이름, 분야, 바르는 순서, 시간대, 개봉 후 사용기한(개월), 아이콘]
const CAT={
  water:['물세안','skin',2,'any',0,'💧'],oilcl:['클렌징 오일·밤','skin',1,'pm',12,'🫧'],foam:['폼·젤 클렌저','skin',2,'any',12,'🫧'],exfol:['각질 제거(스크럽·필링)','skin',2.5,'pm',12,'✨'],
  toner:['토너·스킨','skin',3,'any',12,'💦'],pad:['토너 패드','skin',3,'any',6,'🧻'],essence:['에센스','skin',4,'any',12,'💧'],serum:['세럼·앰플','skin',5,'any',12,'💉'],
  spot:['스팟 케어','skin',6,'any',12,'🎯'],eye:['아이크림','skin',6,'any',12,'👁️'],lotion:['로션·에멀전','skin',7,'any',12,'🧴'],mask:['팩·마스크','skin',7.5,'pm',12,'🎭'],
  cream:['크림','skin',8,'any',12,'🫙'],oil:['페이스 오일','skin',9,'any',12,'🫒'],sun:['선크림','skin',10,'am',12,'☀️'],sleep:['슬리핑팩','skin',11,'pm',12,'🌙'],
  mkbase:['베이스(쿠션·파데)','mk',12,'am',12,'🪞'],mkeye:['아이섀도·라이너','mk',13,'am',12,'👁️'],mascara:['마스카라','mk',13.5,'am',3,'🖌️'],mklip:['립','mk',14,'am',12,'💄'],mketc:['기타 메이크업','mk',13,'am',12,'✨'],
  scalp:['두피 스케일러','hair',0,'any',12,'🧽'],shampoo:['샴푸','hair',1,'any',12,'🧴'],treat:['트리트먼트·헤어팩','hair',2,'any',12,'🫙'],cond:['린스·컨디셔너','hair',3,'any',12,'🧴'],
  leavein:['노워시 트리트먼트·에센스','hair',4,'any',12,'💧'],heat:['열 보호제','hair',5,'any',12,'🛡️'],hoil:['헤어 오일','hair',6,'any',12,'🫒'],style:['스타일링','hair',7,'any',12,'💨']};
const cn=k=>CAT[k]?CAT[k][0]:k, cdom=k=>CAT[k][1], crank=k=>CAT[k][2], cicon=k=>CAT[k]?CAT[k][5]:'•';
const ING={retinol:'레티놀·레티노이드',aha:'AHA(글리콜산·젖산)',bha:'BHA(살리실산)',pha:'PHA',vitc:'비타민C',bpo:'벤조일퍼옥사이드',niac:'나이아신아마이드',cera:'세라마이드',ha:'히알루론산',cica:'시카·판테놀',alc:'알코올 많음',frag:'향료',water_proof:'워터프루프'};
const ACTIVES=['retinol','aha','bha','vitc','bpo'];
const COND=[[1,'😣','트러블·안 좋음'],[2,'😐','보통'],[3,'😊','좋음']];

/* ============ 저장 ============ */
const KEY='gyeol-v1';
function fresh(){
  const P=(cat,name)=>({id:uid(),cat,name,ings:[],opened:'',pao:CAT[cat][4],memo:'',start:TK(),end:'',reason:'',prev:'',next:'',patch:null});
  const toner=P('toner','내 토너'),amp=P('serum','내 앰플'),cream=P('cream','내 크림'),sun=P('sun','내 선크림'),foam=P('foam','내 폼클렌저'),sh=P('shampoo','내 샴푸'),tr=P('treat','내 트리트먼트');
  const S=(p)=>({id:uid(),cat:p.cat,pid:p.id,days:null});
  return {v:1,products:[toner,amp,cream,sun,foam,sh,tr],
    routines:{am:[S(toner),S(amp),S(cream),S(sun)],pm:[S(foam),S(cream)],hair:[S(sh),S(tr)],mk:[]},
    skin:{type:'',sens:false,concerns:[],answers:{}},hair:{answers:{},scalp:'',damage:[],treat:[],habits:{}},
    makeup:false,brush:'',days:{},v1:true};
}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.products)return Object.assign(fresh(),s)}catch(e){}return fresh()}
let state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('저장 공간이 부족해요')}}
const pById=id=>state.products.find(p=>p.id===id);
const active=p=>p&&!p.end;
const dayRec=k=>state.days[k]=state.days[k]||{};
const stepName=s=>{const p=pById(s.pid);return p?p.name:cn(s.cat)};
const stepOn=(s,dow)=>!s.days||s.days.includes(dow);
const perWeek=s=>s.days?s.days.length:7;
const ingsOf=s=>{const p=pById(s.pid);return p?p.ings:[]};
const expireOf=p=>p.opened&&p.pao?addMonths(p.opened,p.pao):'';

/* ============ 피부 타입 테스트 ============ */
const SKQ=[
  ['세안하고 아무것도 안 바른 채 30분이 지나면?',[['많이 당겨요',{d:2}],['조금 당겨요',{d:1}],['편안해요',{}],['코·이마만 번들거려요',{o:1,c:1}],['얼굴 전체가 번들거려요',{o:2}]]],
  ['오후가 되면 얼굴이?',[['건조하고 각질이 보여요',{d:2}],['아침이랑 비슷해요',{}],['T존만 번들거려요',{o:1,c:2}],['전체가 번들거려요',{o:2}]]],
  ['모공은?',[['거의 안 보여요',{d:1}],['코 주변만 보여요',{c:1}],['볼까지 넓게 보여요',{o:2}]]],
  ['새 화장품을 쓰면?',[['자주 따갑거나 붉어져요',{s:2}],['가끔 그래요',{s:1}],['거의 괜찮아요',{}]]],
  ['더위·추위·햇빛에 얼굴이 쉽게 붉어져요?',[['자주 그래요',{s:1}],['별로 안 그래요',{}]]],
  ['여드름·뾰루지는?',[['자주 나요',{o:1,a:2}],['가끔 나요',{a:1}],['거의 안 나요',{}]]],
  ['각질이 일어나요?',[['자주요',{d:1}],['가끔요',{}],['거의 안 그래요',{}]]]];
function skinResult(ans){const s={o:0,d:0,c:0,s:0,a:0};Object.entries(ans).forEach(([q,i])=>{const sc=SKQ[q][1][i][1];for(const k in sc)s[k]+=sc[k]});
  let type=s.c>=2&&s.o<4?'combo':s.o>=3?'oily':s.d>=3?'dry':s.c>=1?'combo':'normal';return {type,sens:s.s>=2,acne:s.a>=2,s}}
const TYPE={oily:'지성',dry:'건성',combo:'복합성',normal:'중성'};

/* ============ 피부 검사 ============ */

  else{const last=am.filter(s=>cdom(s.cat)==='skin').slice(-1)[0];if(last&&last.cat!=='sun')add('w','선크림이 아침 마지막이 아니에요',`선크림 뒤에 ${cn(last.cat)}가 있어요. 스킨케어 맨 마지막(화장 전)에 바르는 게 좋아요.`);

  if(has(pm,'sun'))add('w','저녁 루틴에 선크림이 있어요','밤에는 필요 없어요. 빼도 돼요.');
  // 순서
  for(const [nm,rt] of [['아침',am],['저녁',pm]]){const sk2=rt.filter(s=>cdom(s.cat)==='skin');let bad=null;
    for(let i=1;i<sk2.length;i++)if(crank(sk2[i].cat)<crank(sk2[i-1].cat)){bad=[sk2[i-1],sk2[i]];break}
    if(bad)add('w',`${nm} 순서: ${cn(bad[0].cat)} → ${cn(bad[1].cat)}`,`보통은 ${cn(bad[1].cat)}를 먼저 발라요. 묽은 것 → 진한 것, 물 → 오일 순서가 흡수에 좋아요. 루틴 편집에서 '추천 순서로 정렬'을 눌러 보세요.`)
    else if(sk2.length>1)add('g',`${nm} 바르는 순서가 맞아요`,sk2.map(s=>cn(s.cat)).join(' → '))}
  // 세안
  const pmCl=pm.filter(s=>['oilcl','foam'].includes(s.cat));

  else if(!has(pm,'oilcl')&&has(am,'sun')){const wp=am.some(s=>s.cat==='sun'&&ingsOf(s).includes('water_proof'));
    add(wp?'w':'t',wp?'워터프루프 선크림인데 저녁 세안이 한 번이에요':'선크림 바른 날 저녁 세안, 이대로 괜찮아요',wp?'워터프루프는 폼클렌저만으로 잘 안 지워져요. 클렌징 오일·밤 → 폼클렌저 이중 세안을 추천해요.':'일반 선크림은 폼클렌저로 꼼꼼히 씻으면 충분한 경우가 많아요. 다만 워터프루프나 톤업 선크림, 화장한 날은 클렌징 오일·밤으로 먼저 지우는 이중 세안이 좋아요.')}
  if(!am.some(s=>['water','foam'].includes(s.cat)))add('t','아침 세안 단계가 없어요',sk.type==='oily'||sk.type==='combo'?'자고 일어나서 번들거린다면 미지근한 물세안이나 순한 클렌저로 가볍게 씻고 시작하는 걸 추천해요.':'건성이나 중성이면 아침엔 물세안만, 또는 바로 토너로 시작해도 괜찮아요. 미지근한 물세안 정도는 넣어 보세요.');
  // 보습
  const moist=rt=>rt.some(s=>['cream','lotion','sleep'].includes(s.cat));
  if(!moist(pm))add(sk.type==='dry'?'b':'w','저녁에 보습 단계(크림·로션)가 없어요','세안 후 수분이 빠져나가기 쉬워서 마지막에 크림이나 로션으로 덮어 주는 게 좋아요.');

  for(const [nm,rt] of [['아침',am],['저녁',pm]]){const acts=new Set();rt.forEach(s=>ingsOf(s).filter(i=>ACTIVES.includes(i)).forEach(i=>acts.add(i)));
    if(acts.size>=3)add('w',`${nm}에 기능성 성분이 ${acts.size}개 겹쳐요`,[...acts].map(i=>ING[i]).join(', ')+' — 한 번에 하나씩 늘려 가야 어떤 게 맞는지 알 수 있고 자극도 줄어요.');

  if(h.water==='hot')add('w','뜨거운 물로 감고 있어요','두피 유분이 지나치게 빠지고 머릿결도 푸석해져요. 미지근한 물(체온 정도)로 감고, 마지막은 살짝 시원하게 헹궈 보세요.');

  else if(h.wetbed==='often')add('b','젖은 머리로 자주 자요','두피가 축축하면 세균이 자라기 쉽고 머릿결도 베개에 쓸려 상해요. 두피부터 완전히 말리고 자 주세요.');

  if(h.dryer==='none')add('t','자연 건조를 하고 있어요','짧은 머리면 괜찮지만, 길면 두피가 오래 젖어 있어요. 두피 쪽만이라도 드라이기로 말려 주세요.');

function condChart(key,dom){
  const N=42,T=today(),W=340,H=90,L=8,R2=W-8,x=i=>L+(R2-L)*i/(N-1),y=v=>H-20-(v-1)*25;
  let g='';[1,2,3].forEach(v=>g+=`<line x1="${L}" x2="${R2}" y1="${y(v)}" y2="${y(v)}" stroke="#eef2f1"/>`);
  const pts=[];for(let i=0;i<N;i++){const k=keyOf(addDays(T,i-N+1)),r=state.days[k];if(r&&r[key])pts.push([x(i),y(r[key]),r[key]])}
  if(pts.length>1)g+=`<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1]).join(' ')}" fill="none" stroke="#2f8c8f" stroke-width="1.5" opacity=".5"/>`;
  pts.forEach(p=>g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1]}" r="3.5" fill="${p[2]===3?'#3f8f5e':p[2]===2?'#d9a03b':'#cc5644'}"/>`);
  state.products.filter(p=>p.prev&&cdom(p.cat)===dom).forEach(p=>{const i=diffDays(keyOf(addDays(T,-N+1)),p.start);if(i>=0&&i<N)g+=`<line x1="${x(i)}" x2="${x(i)}" y1="4" y2="${H-14}" stroke="#e0765f" stroke-dasharray="3 3"/><text x="${x(i)+3}" y="12" font-size="9" fill="#e0765f">${esc(cn(p.cat))} 교체</text>`});
  g+=`<text x="${L}" y="${H-2}" font-size="10" fill="#728087">${md(keyOf(addDays(T,-N+1)))}</text><text x="${R2}" y="${H-2}" font-size="10" fill="#728087" text-anchor="end">오늘</text>`;
  return pts.length?`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 6주 상태">${g}</svg><div class="small muted">😊 위 · 😣 아래 · 점선 = 제품 바꾼 날</div>`:'<p class="hint">오늘 탭에서 상태를 남기면 여기 그래프가 생겨요.</p>';
}

  <label>종류</label><select class="in" data-p="cat" ${R.sw?'disabled':''}>${cats.map(k=>`<option value="${k}"${p.cat===k?' selected':''}>${cicon(k)} ${cn(k)}</option>`).join('')}</select>
  ${cdom(p.cat)!=='hair'?`<label>들어 있는 주요 성분 <small>(제품 뒷면 전성분에서 찾아 체크)</small></label><div class="chips">${Object.entries(ING).filter(([k])=>k!=='water_proof'||p.cat==='sun').map(([k,l])=>`<button class="chip ${p.ings.includes(k)?'on':''}" data-ing="${k}">${l}</button>`).join('')}</div>`:''}
  <div class="row"><div style="flex:1"><label>개봉일</label><input type="date" class="in" data-p="opened" value="${p.opened}"></div><div style="flex:1"><label>개봉 후 사용기한</label><select class="in" data-p="pao">${[3,6,12,18,24].map(m=>`<option value="${m}"${+p.pao===m?' selected':''}>${m}개월</option>`).join('')}</select></div></div>
  <p class="hint" style="margin-top:6px">통 뒷면의 열린 뚜껑 그림(예: 12M)이 개봉 후 사용기한이에요.</p>
  <label>메모</label><input class="in" data-p="memo" value="${esc(p.memo)}" placeholder="예: 향이 좋음, 끈적임 있음">
  ${R.sw?`<label>바꾸는 이유</label><div class="chips">${['다 써서','안 맞아서','트러블이 나서','더 좋은 걸 찾아서','기타'].map(r=>`<button class="chip ${R.reason===r?'on':''}" data-reason="${r}">${r}</button>`).join('')}</div>`:''}
  ${cdom(p.cat)==='skin'&&!(p.id&&pById(p.id))?`<button class="tog${p.doPatch?' on':''}" style="margin-top:12px" data-act="togPatch"><span>🧪 패치 테스트 먼저 하기<small class="muted" style="display:block;font-size:12px">귀 뒤·턱선에 3일 발라 보고 괜찮으면 얼굴에</small></span><i></i></button>`:''}</section>
  <button class="btn pri full" data-act="saveProd">저장</button>`;
}
function vPDetail(){
  const p=pById(R.id);if(!p)return go('prod');const chain=[];let c=p;while(c&&c.prev&&pById(c.prev))c=pById(c.prev);while(c){chain.push(c);c=c.next?pById(c.next):null}
  const inR=Object.entries(state.routines).filter(([,l])=>l.some(s=>s.pid===p.id)).map(([k])=>({am:'아침',pm:'저녁',hair:'머리',mk:'화장'}[k]));
  const cmp=p.prev?compare(p):null,ex=expireOf(p);
  main.innerHTML=`<div><button class="lnk" data-go="prod">‹ 제품</button></div><h2>${cicon(p.cat)} ${esc(p.name)}</h2><p class="hint">${esc(cn(p.cat))}${active(p)?'':' · 지금은 안 씀'}</p>
  <section class="card">${p.ings.length?`<div class="chips">${p.ings.map(i=>`<span class="chip">${ING[i]}</span>`).join('')}</div>`:'<p class="hint" style="margin:0">체크한 성분 없음</p>'}
  <p style="margin:10px 0 0;font-size:14px">${p.opened?`개봉 ${p.opened} · 기한 ${ex}`:'개봉일 미입력'}${inR.length?`<br>루틴: ${inR.join(', ')}`:''}${p.memo?`<br>메모: ${esc(p.memo)}`:''}</p>
  ${cmp?`<div class="banner ${cmp.cls==='g'?'a':cmp.cls==='b'?'b':'w'}" style="margin-bottom:0">${cmp.cls==='g'?'👍':cmp.cls==='b'?'👎':'➖'} 이 제품으로 바꾼 뒤: ${cmp.txt}</div>`:p.prev?'<p class="hint" style="margin:10px 0 0">바꾸기 전후 2주씩 상태 기록이 3일 이상 있으면 효과를 비교해 드려요.</p>':''}</section>
  ${chain.length>1?`<section class="card"><h3>${esc(cn(p.cat))} 바꾼 기록</h3><div class="hist">${chain.map(x=>`<div class="${x.id===p.id?'cur':''}"><b style="font-weight:${x.id===p.id?700:400}">${esc(x.name)}</b><br><small>${md(x.start)} ~ ${x.end?md(x.end)+' · '+esc(x.reason||''):'지금'}</small></div>`).join('')}</div></section>`:''}
  ${active(p)?`<button class="btn pri full" data-act="switchProd">🔄 다른 제품으로 바꾸기</button><div class="row" style="margin-top:8px"><button class="btn" data-act="editProd">고치기</button><button class="btn danger" data-act="retireProd">그만 쓰기</button></div>`:`<button class="btn full" data-act="reviveProd">다시 쓰기</button>`}
  <button class="lnk" style="margin-top:10px" data-act="delProd">기록에서 완전히 삭제</button>`;
}

/* ----- 설정 ----- */
function vSet(){
  main.innerHTML=`<h2>설정</h2>
  <section class="card"><button class="tog${state.makeup?' on':''}" data-act="togMakeup"><span>💄 화장 관리 쓰기<small class="muted" style="display:block;font-size:12px">화장 제품·순서, 이중 세안, 브러시 세척 알림이 생겨요</small></span><i></i></button></section>
  <section class="card"><h3>백업</h3><p class="hint">기록은 이 휴대폰 브라우저에만 저장돼요.</p><div class="row"><button class="btn" data-act="export">내보내기</button><button class="btn" data-act="import">불러오기</button></div><input type="file" id="impF" accept=".json,application/json" hidden></section>
  <section class="card"><h3>둘러보기</h3><p class="hint">3주치 상태 기록과 제품 교체 예시를 넣어서 그래프·비교 기능을 볼 수 있어요. 지금 기록은 지워져요.</p><button class="btn full" data-act="sample">예시 데이터로 바꾸기</button></section>
  <section class="card"><h3>처음부터</h3><p class="hint">처음 상태(내가 말한 기본 루틴)로 되돌려요.</p><button class="btn danger full" data-act="wipe">모두 지우고 처음으로</button></section>`;
}

/* ============ 동작 ============ */
function newProd(cat,extra){return Object.assign({id:uid(),cat,name:'',ings:[],opened:TK(),pao:CAT[cat][4]||12,memo:'',start:TK(),end:'',reason:'',prev:'',next:'',patch:null,doPatch:cdom(cat)==='skin'},extra||{})}
function sortRoutine(rt){state.routines[rt].sort((a,b)=>crank(a.cat)-crank(b.cat))}
function makeSample(){
  state=fresh();const T=today(),S=state;
  S.skin={type:'combo',sens:false,concerns:['acne','pore'],answers:{0:3,1:2,2:1,3:2,4:1,5:1,6:1}};
  S.hair={answers:{},scalp:'oily',damage:['split','frizz'],treat:['dye'],habits:{scalp:'oily',water:'hot',where:'scalp',wait:'0',towel:'rub',dryer:'hot',protect:'no',wetbed:'some',iron:'some',when:'am',brush:'wethard'}};
  const toner=S.products.find(p=>p.cat==='toner'),old=Object.assign({},toner,{id:uid(),name:'예전 토너',start:keyOf(addDays(T,-60)),end:keyOf(addDays(T,-10)),reason:'트러블이 나서',ings:['alc','frag']});
  toner.name='약산성 수분 토너';toner.start=keyOf(addDays(T,-10));toner.prev=old.id;old.next=toner.id;toner.ings=['niac'];S.products.push(old);
  for(let i=24;i>=1;i--){const k=keyOf(addDays(T,-i)),after=i<=10;S.days[k]={sk:after?(Math.random()<.6?3:2):(Math.random()<.5?1:2),hc:Math.random()<.5?1:2,am:{},pm:{},hr:{}}}
  save();
}
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)));
main.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset,T=TK();
  if(d.go){return go(d.go,d.sub?{sub:d.sub}:{})}
  if(d.sub){R.sub=d.sub;return render()}
  if(d.dom){R.dom=d.dom;return render()}
  if(d.ck){const D=dayRec(T);D[d.ck]=D[d.ck]||{};D[d.ck][d.sid]?delete D[d.ck][d.sid]:D[d.ck][d.sid]=true;save();const y=scrollY;render();scrollTo(0,y);return}
  if(d.cond){const D=dayRec(T);D[d.cond]=D[d.cond]===+d.v?0:+d.v;save();const y=scrollY;render();scrollTo(0,y);return}
  if(d.patch){const p=pById(d.pid);if(d.patch==='ok'){p.patch.state='ok';toast('얼굴에 써도 좋아요. 처음 며칠은 지켜봐 주세요')}else{p.patch.state='bad';p.end=T;p.reason='패치 테스트 반응';Object.values(state.routines).forEach(l=>l.forEach(s=>{if(s.pid===p.id)s.pid=''}));toast('그만 쓰는 제품으로 옮겼어요')}save();return render()}
  if(d.sq!==undefined){state.skin.answers[d.sq]=+d.j;save();const y=scrollY;render();scrollTo(0,y);return}
  if(d.conc){R.conc=R.conc||[];const i=R.conc.indexOf(d.conc);i>=0?R.conc.splice(i,1):R.conc.push(d.conc);t.classList.toggle('on',i<0);return}
  if(d.hdmg){const a=state.hair.damage,i=a.indexOf(d.hdmg);i>=0?a.splice(i,1):a.push(d.hdmg);t.classList.toggle('on',i<0);save();return}
  if(d.htrt){const a=state.hair.treat,i=a.indexOf(d.htrt);i>=0?a.splice(i,1):a.push(d.htrt);t.classList.toggle('on',i<0);save();return}
  if(d.hq){if(d.hq==='scalp')state.hair.scalp=d.v;else state.hair.habits[d.hq]=d.v;save();t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));return}
  if(d.mv){const l=state.routines[d.mv],i=+d.i,j=i+(+d.d);if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];save();return render()}
  if(d.dw){const s=state.routines[d.dw][+d.i],dd=+d.d;let a=s.days?s.days.slice():[0,1,2,3,4,5,6];const k=a.indexOf(dd);k>=0?a.splice(k,1):a.push(dd);if(!a.length){toast('하루는 남겨 두세요');return}s.days=a.length===7?null:a.sort();save();return render()}
  if(d.rm){state.routines[d.rm].splice(+d.i,1);save();return render()}
  if(d.addstep){const cat=document.getElementById('add-'+d.addstep).value,p=state.products.find(x=>active(x)&&x.cat===cat);state.routines[d.addstep].push({id:uid(),cat,pid:p?p.id:'',days:cat==='exfol'||cat==='mask'?[2,5]:null});save();toast(p?`'${p.name}'로 추가했어요`:'추가했어요. 제품을 골라 주세요');return render()}
  if(d.sort){sortRoutine(d.sort);save();toast('추천 순서로 정렬했어요');return render()}
  if(d.pd){return go('pdetail',{id:d.pd})}
  if(d.ing){const a=R.d.ings,i=a.indexOf(d.ing);i>=0?a.splice(i,1):a.push(d.ing);t.classList.toggle('on',i<0);return}
  if(d.reason){R.reason=d.reason;t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));return}
  const A=ACT[d.act];if(A)A(t);
});
const ACT={
  mkToday(){const D=dayRec(TK());D.makeup=!D.makeup;save();render()},
  washed(){const D=dayRec(TK());D.washed=!D.washed;save();render()},
  brushDone(){state.brush=TK();save();toast('기록했어요');render()},
  skinSave(){const r=skinResult(state.skin.answers);Object.assign(state.skin,{type:r.type,sens:r.sens,concerns:R.conc||[]});save();toast(`${TYPE[r.type]}${r.sens?' · 민감':''} 피부로 저장했어요`);go('skin',{sub:'check'})},
  hairSave(){if(!state.hair.scalp){toast('두피 질문에 답해 주세요');return}const miss=Object.keys(HQ).filter(k=>k!=='scalp'&&!state.hair.habits[k]).length;state.hair.habits.scalp=state.hair.scalp;save();
    toast(miss?`${miss}개 질문을 건너뛰었어요. 답한 것만으로 검사할게요`:'저장했어요');go('hair',{sub:'check'})},
  newProd(){go('pform',{d:newProd(Object.keys(CAT).find(k=>cdom(k)===(R.dom||'skin'))),dom:R.dom||'skin',back:'prod'})},
  pformBack(){R.back==='pdetail'?go('pdetail',{id:R.sw||R.d.id}):R.back==='routine'?go(R.backView,{sub:'routine'}):go('prod',{dom:R.dom})},
  togPatch(){R.d.doPatch=!R.d.doPatch;render()},
  saveProd(){const p=R.d;p.name=(p.name||'').trim();if(!p.name){toast('제품 이름을 넣어 주세요');return}
    if(p.doPatch&&!pById(p.id))p.patch={start:TK(),state:'on'};delete p.doPatch;
    if(R.sw){const o=pById(R.sw);o.end=TK();o.reason=R.reason||'바꿈';o.next=p.id;p.prev=o.id;p.start=TK();p.cat=o.cat;Object.values(state.routines).forEach(l=>l.forEach(s=>{if(s.pid===o.id)s.pid=p.id}));state.products.push(p);save();toast(`${o.name} → ${p.name} 바꿨어요`);return go('pdetail',{id:p.id})}
    const i=state.products.findIndex(x=>x.id===p.id);if(i>=0)state.products[i]=p;else{state.products.push(p);if(R.stepRef){const s=state.routines[R.stepRef.rt][R.stepRef.i];if(s&&s.cat===p.cat)s.pid=p.id}}
    save();toast('저장했어요');if(R.back==='routine')return go(R.backView,{sub:'routine'});go('pdetail',{id:p.id})},
  editProd(){go('pform',{d:JSON.parse(JSON.stringify(pById(R.id))),dom:cdom(pById(R.id).cat),back:'pdetail'})},
  switchProd(){const o=pById(R.id);go('pform',{d:newProd(o.cat,{ings:[],pao:o.pao}),dom:cdom(o.cat),sw:o.id,reason:'',back:'pdetail'})},
  retireProd(){if(!confirm('그만 쓰는 제품으로 옮길까요? 루틴에서는 제품 없이 단계만 남아요.'))return;const p=pById(R.id);p.end=TK();p.reason='그만 씀';Object.values(state.routines).forEach(l=>l.forEach(s=>{if(s.pid===p.id)s.pid=''}));save();render()},
  reviveProd(){const p=pById(R.id);p.end='';p.reason='';save();toast('다시 쓰는 제품으로 옮겼어요. 루틴에서 골라 주세요');render()},
  delProd(){if(!confirm('이 제품 기록을 완전히 지울까요?'))return;const p=pById(R.id);state.products.forEach(x=>{if(x.prev===p.id)x.prev='';if(x.next===p.id)x.next=''});Object.values(state.routines).forEach(l=>l.forEach(s=>{if(s.pid===p.id)s.pid=''}));state.products=state.products.filter(x=>x.id!==p.id);save();go('prod')},
  togMakeup(){state.makeup=!state.makeup;if(state.makeup&&!state.brush)state.brush='';save();toast(state.makeup?'화장 관리를 켰어요. 피부 탭 → 화장에서 순서를 만들어 보세요':'화장 관리를 껐어요');render()},
  export(){download(new Blob([JSON.stringify({app:'gyeol',state})],{type:'application/json'}),`gyeol-backup-${TK()}.json`);toast('백업 파일을 내보냈어요')},
  import(){document.getElementById('impF').click()},
  sample(){if(!confirm('지금 기록을 지우고 예시 데이터로 바꿀까요?'))return;makeSample();toast('예시 데이터를 넣었어요');go('skin',{sub:'trend'})},
  wipe(){if(!confirm('모든 기록을 지우고 처음 상태로 돌아갈까요?'))return;state=fresh();save();toast('처음 상태로 돌아갔어요');go('today')}
};
main.addEventListener('change',e=>{const t=e.target,d=t.dataset;
  if(d.sp){const rt=d.sp,i=+d.i,s=state.routines[rt][i];if(t.value==='__new'){return go('pform',{d:newProd(s.cat),dom:cdom(s.cat),back:'routine',backView:rt==='hair'?'hair':'skin',stepRef:{rt,i}})}s.pid=t.value;save();return}
  if(d.p!==undefined){R.d[d.p]=d.p==='pao'?+t.value:t.value;if(d.p==='cat'){R.d.pao=CAT[t.value][4]||12;R.d.doPatch=cdom(t.value)==='skin';render()}return}
  if(t.id==='impF'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.app!=='gyeol')throw 0;if(!confirm('지금 기록을 백업 내용으로 바꿀까요?'))return;state=Object.assign(fresh(),j.state);save();toast('불러왔어요');go('today')}catch(err){toast('올바른 백업 파일이 아니에요')}};r.readAsText(t.files[0]);t.value=''}
});
main.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.p!==undefined&&t.tagName==='INPUT'&&t.type!=='date')R.d[d.p]=t.value});
render();
</script>
